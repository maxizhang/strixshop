<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strix Shop | My Account</title>
    <link rel="icon" type="image/png" href="logospfd.png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --surface: rgba(255, 255, 255, 0.18);
            --text-main: #0f172a;
            --text-dim: #475569;
            --border: rgba(255, 255, 255, 0.55);
            --nav-dark: #0a0c12;
            --accent: #6f8bb9;
            --admin-gold: rgb(255, 213, 28);
            --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.8), inset 0 -1px 2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(-45deg, #e0e7ff, #f0fdf4, #e0f2fe, #f3e8ff);
            background-size: 400% 400%;
            animation: fluidBackground 20s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        @keyframes fluidBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #bgstar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Professional Navbar */
        nav {
            background: var(--nav-dark);
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .nav-main {
            display: flex;
            align-items: center;
            padding: 14px 5%;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-box img {
            height: 32px;
            cursor: pointer;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        .nav-right-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: color 0.2s;
        }

        .nav-link-item svg {
            stroke: #cbd5e1;
            transition: stroke 0.2s;
        }

        .nav-link-item:hover {
            color: #ffffff;
        }

        .nav-link-item:hover svg {
            stroke: #ffffff;
        }

        #admin-link {
            color: var(--admin-gold) !important;
            border: 1px solid var(--admin-gold);
            padding: 4px 10px;
            border-radius: 8px;
            background: rgba(255, 193, 7, 0.05);
        }
        #admin-link:hover {
            background: var(--admin-gold);
            color: #000 !important;
        }

        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-badge-text {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        /* Container & Layout */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            width: 90%;
            margin: 40px auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 30px;
            background: var(--surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            padding: 40px;
            border-radius: 32px;
            border: 1.5px solid var(--border);
            box-shadow: var(--glass-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        .profile-header:hover {
            background: rgba(255, 255, 255, 0.28);
            transform: translateY(-4px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12), inset 0 1px 3px rgba(255, 255, 255, 0.9);
        }

        .pfp-wrap {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            overflow: hidden;
            background: #111;
            flex-shrink: 0;
        }

        .pfp-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Data Grid - Strictly 3 Boxes Per Row */
        .data-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            width: 100%;
        }

        .vault-card {
            background: var(--surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 28px;
            border: 1.5px solid var(--border);
            padding: 30px;
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        .vault-card:hover {
            background: rgba(255, 255, 255, 0.28);
            transform: translateY(-4px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12), inset 0 1px 3px rgba(255, 255, 255, 0.9);
        }

        .card-title {
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--primary);
            text-transform: uppercase;
            font-size: 11px;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 13px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label {
            color: var(--text-dim);
            font-weight: 600;
        }

        .val {
            font-weight: 700;
            text-align: right;
            color: #1e1b4b;
        }

        .bottom-bar {
            text-align: center;
            padding: 25px;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        @media (max-width: 900px) {
            .data-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
        }

        @media (max-width: 600px) {
            .data-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<canvas id="bgstar"></canvas>

<nav>
    <div class="nav-main">
        <div class="logo-box" onclick="window.location.href='home.html'">
            <img src="logoh.png" alt="STRIX">
        </div>
        <div class="nav-right-actions">
            <a href="home.html" class="nav-link-item">
                <svg width="15" height="15" fill="none" stroke-width="2.2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Home
            </a>
            <a href="products.html" class="nav-link-item">Products</a>
            <a href="cart.html" class="nav-link-item">Cart</a>
            <a href="adminportal.html" id="admin-link" class="nav-link-item" style="display:none;">Admin Terminal</a>
            <div class="nav-divider"></div>
            <span class="nav-badge-text">Account</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="profile-header">
        <div class="pfp-wrap"><img id="display-pfp" src="logospfd.png"></div>
        <div style="flex: 1;">
            <h1 id="display-username" style="margin:0; font-size: 28px; color: #1e1b4b;">Syncing...</h1>
            <p id="display-email" style="margin:6px 0 0; color:var(--text-dim); font-size: 14px; font-weight: 600;"></p>
        </div>
        <div style="text-align: center; padding: 0 20px; border-left: 1px solid rgba(255,255,255,0.3);">
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 2.2rem; font-weight: 700; color: #1e1b4b;" id="val-ssc">---</div>
            <div style="font-size: 11px; letter-spacing: 1px; color: var(--primary); font-weight: 700; text-transform: uppercase;">Strix Shop Credits</div>
        </div>
    </div>

    <div class="data-grid">
        <div class="vault-card">
            <span class="card-title">Identity</span>
            <div class="info-row"><span class="label">Full Name</span><span class="val" id="val-fullname">---</span></div>
            <div class="info-row"><span class="label">Date of Birth</span><span class="val" id="val-dob">---</span></div>
            <div class="info-row"><span class="label">Age</span><span class="val" id="val-age">---</span></div>
            <div class="info-row"><span class="label">Gender</span><span class="val" id="val-gender">---</span></div>
            <div class="info-row"><span class="label">Pronouns</span><span class="val" id="val-pronouns">---</span></div>
        </div>

        <div class="vault-card">
            <span class="card-title">Academic</span>
            <div class="info-row"><span class="label">School</span><span class="val" id="val-school">---</span></div>
            <div class="info-row"><span class="label">Grade Level</span><span class="val" id="val-grade">---</span></div>
        </div>

        <div class="vault-card">
            <span class="card-title">Security</span>
            <div class="info-row"><span class="label">Security Question</span><span class="val" id="val-question">---</span></div>
            <div class="info-row"><span class="label">Recovery Email</span><span class="val" id="val-recovery">---</span></div>
            <div class="info-row"><span class="label">Member Since</span><span class="val" id="val-timestamp">---</span></div>
        </div>
    </div>

    <div class="bottom-bar">
        &copy; 2026 STRIX SHOP. ALL RIGHTS RESERVED.
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyDKed-yuAcwqKqcL6fn2WnBhRPcq-PbDtU", 
        authDomain: "strix-shop.firebaseapp.com", 
        projectId: "strix-shop" 
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const docRef = doc(db, "users", user.uid);
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
                const data = docSnap.data();

                const adminLink = document.getElementById('admin-link');
                const masterUID = "PNssYZn1wNUGjmzeAq1eHz2QHKf1";
                
                if (data.acc === "admin" || user.uid === masterUID) {
                    if (adminLink) adminLink.style.display = "inline-flex";
                }
                
                const sscElement = document.getElementById('val-ssc');
                if(sscElement) sscElement.innerText = (data.ssc !== undefined) ? data.ssc : "100";
                
                document.getElementById('display-username').innerText = data.username || "Authorized Personnel";
                document.getElementById('display-email').innerText = user.email || "";
                
                const pfpElement = document.getElementById('display-pfp');
                pfpElement.src = data.pfp || "logospfd.png";
                
                document.getElementById('val-fullname').innerText = `${data.firstName || ''} ${data.lastName || ''}`.trim() || '---';
                document.getElementById('val-dob').innerText = data.dob || '---';
                document.getElementById('val-age').innerText = data.age || '---';
                document.getElementById('val-gender').innerText = data.gender || '---';
                document.getElementById('val-pronouns').innerText = data.pronouns || '---';
                document.getElementById('val-school').innerText = data.school || '---';
                document.getElementById('val-grade').innerText = data.grade ? "Grade " + data.grade : '---';
                document.getElementById('val-question').innerText = data.securityQuestion || '---';
                document.getElementById('val-recovery').innerText = data.recoveryEmail || "None";
                document.getElementById('val-timestamp').innerText = data.createdAt ? data.createdAt.toDate().toLocaleString() : 'UNDEFINED';
            }
        } else { 
            window.location.href = "index.html"; 
        }
    });

    const canvas = document.getElementById('bgstar');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() { 
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight; 
    }

    class Star {
        constructor() { 
            this.x = Math.random() * canvas.width; 
            this.y = Math.random() * canvas.height; 
            this.size = Math.random() * 1.5; 
            this.alpha = Math.random(); 
            this.blink = Math.random() * 0.02; 
        }
        draw() {
            this.alpha += this.blink; 
            if (this.alpha > 1 || this.alpha < 0) this.blink = -this.blink;
            ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`; 
            ctx.beginPath(); 
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
            ctx.fill();
        }
    }

    function initStars() { 
        stars = []; 
        for(let i=0; i<150; i++) stars.push(new Star()); 
    }

    function animate() { 
        ctx.clearRect(0, 0, canvas.width, canvas.height); 
        stars.forEach(s => s.draw()); 
        requestAnimationFrame(animate); 
    }

    window.addEventListener('resize', () => { 
        resize(); 
        initStars(); 
    });

    resize(); 
    initStars(); 
    animate();
</script>
</body>
</html>
