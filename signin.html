<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="spfd.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strix Shop | Sign In</title>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        quicksand: ['Quicksand', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #f1f5f9;
            color: #1e293b;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        .bg-image-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.85;
            z-index: 0;
            transition: background-image 1s ease-in-out;
        }

        .overlay-shield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                circle,
                rgba(255,255,255,0.3) 0%,
                rgba(241,245,249,0.8) 100%
            );
            z-index: 2;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow:
                0 25px 50px -12px rgba(30, 41, 59, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            20% {
                opacity: 1;
                transform: translateY(0);
            }
            80% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-6px);
            }
        }

        .fade-text {
            animation: fadeInOut 2s ease-in-out infinite;
        }

        /* Custom Component Styles moved to stylesheet */
        .auth-input {
            width: 100%;
            padding: 1rem 1.25rem;
            background-color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 9999px;
            color: #1e293b;
            font-family: 'Quicksand', sans-serif;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .auth-input::placeholder {
            color: #94a3b8;
        }

        .auth-input:focus {
            --tw-ring-color: #94a3b8;
            border-color: #94a3b8;
            background-color: #ffffff;
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            margin-top: 0.5rem;
            background-color: #0f172a;
            color: #ffffff;
            border-radius: 9999px;
            font-weight: 700;
            box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.1);
            transition: all 0.2s ease;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #1e293b;
            transform: translateY(-1px);
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.1);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-google {
            width: 100%;
            padding: 1rem;
            margin-top: 0.5rem;
            background-color: #ffffff;
            color: #334155;
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 9999px;
            font-weight: 700;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .btn-google:hover:not(:disabled) {
            background-color: #f8fafc;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body class="relative flex items-center justify-center min-h-screen">

    <div class="bg-image-layer" id="bgLayer"></div>
    <div class="overlay-shield"></div>

    <div class="relative z-10 w-full max-w-5xl mx-4 sm:mx-6 lg:mx-auto">
        <div class="glass-card rounded-[36px] overflow-hidden grid grid-cols-1 lg:grid-cols-12">

            <div class="lg:col-span-7 p-8 sm:p-12 flex flex-col justify-center">
                <div class="text-center lg:text-left mb-8">
                    <h1 class="text-3xl font-bold tracking-wider text-slate-900 mb-1">
                        STRIX SHOP
                    </h1>

                    <span class="text-xs text-slate-500 font-medium tracking-wide">
                        System Version: 6.1.1
                    </span>

                    <br>

                    <span class="text-xs text-slate-500 font-medium tracking-wide">
                        Updated September 28th, 2026
                    </span>
                </div>

                <div id="cardContainer">
                    <form id="loginForm" class="space-y-4">

                        <div>
                            <input
                                type="email"
                                id="email"
                                placeholder="Email Address"
                                autocomplete="email"
                                required
                                class="auth-input"
                            >
                        </div>

                        <div>
                            <input
                                type="password"
                                id="password"
                                placeholder="Password"
                                autocomplete="current-password"
                                required
                                class="auth-input"
                            >
                        </div>

                        <div
                            id="error-display"
                            class="text-rose-500 text-xs min-h-[1.2rem] font-medium px-2"
                        ></div>

                        <button
                            type="submit"
                            id="mainBtn"
                            class="btn-primary"
                        >
                            Sign In
                        </button>

                        <button
                            type="button"
                            id="googleBtn"
                            class="btn-google"
                        >
                            <svg class="w-5 h-5" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                            </svg>
                            Sign In with Google
                        </button>
                    </form>

                    <div class="mt-8 flex flex-wrap justify-center lg:justify-start items-center gap-4 text-xs">
                        <a
                            href="createacc.html"
                            class="text-slate-600 hover:text-slate-900 font-semibold transition-colors"
                        >
                            Create Account
                        </a>

                        <span class="text-slate-300">|</span>

                        <a
                            href="mailto:hello.strix@outlook.com"
                            class="text-slate-600 hover:text-slate-900 font-semibold transition-colors"
                        >
                            Having trouble signing in?
                        </a>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-5 flex flex-col justify-between items-center p-8 sm:p-10 bg-gradient-to-br from-slate-900/5 via-slate-900/10 to-indigo-900/10 border-l border-white/60 relative overflow-hidden text-center">

                <div class="w-full"></div>

                <div class="relative z-15 max-w-sm my-auto">

                    <div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-slate-900/10 flex items-center justify-center border border-white/60 shadow-inner">
                        <svg
                            class="w-8 h-8 text-slate-700"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="1.5"
                                d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                            ></path>
                        </svg>
                    </div>

                    <div
                        id="multilingualWelcome"
                        class="text-xl sm:text-2xl font-bold text-slate-800 tracking-wide min-h-[4rem] flex items-center justify-center fade-text"
                    ></div>

                    <p class="text-slate-500 text-xs sm:text-sm mt-4 font-light">
                        Hello, World! Welcome to Strix Shop!
                    </p>
                </div>

                <div
                    class="w-full pt-4 border-t border-slate-200/60 text-xs text-slate-500 font-medium tracking-wide"
                    id="liveDateTime"
                ></div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            GoogleAuthProvider,
            signInWithPopup,
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            setDoc,
            arrayUnion
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        /* BACKGROUND */

        const bgNumber = Math.floor(Math.random() * 12) + 1;
        const bgLayer = document.getElementById("bgLayer");
        const imgUrl = `bg${bgNumber}.png`;

        const testImg = new Image();
        testImg.src = imgUrl;

        testImg.onload = () => {
            bgLayer.style.backgroundImage = `url('${imgUrl}')`;
        };

        testImg.onerror = () => {
            bgLayer.style.backgroundImage =
                "linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 50%, #94a3b8 100%)";
        };


        /* MULTILINGUAL GREETINGS */

        const greetings = [
            "Welcome to Strix Shop",
            "欢迎来到Strix商店",
            "歡迎來到Strix商店",
            "Bienvenido a Strix Shop",
            "Bienvenue chez Strix Shop",
            "Willkommen im Strix Shop",
            "Strixショップへようこそ",
            "스트릭스 숍에 오신 것을 환영합니다",
            "Добро пожаловать в магазин Strix",
            "Bem-vindo à Strix Shop",
            "स्ट्रिक्स शॉप में आपका स्वागत है",
            "Välkommen till Strix Shop"
        ];

        let greetingIdx = 0;
        const welcomeEl =
            document.getElementById("multilingualWelcome");

        function updateGreeting() {
            welcomeEl.innerText = greetings[greetingIdx];
            greetingIdx =
                (greetingIdx + 1) % greetings.length;
        }

        updateGreeting();
        setInterval(updateGreeting, 2000);


        /* DATE / TIME */

        function updateDateTime() {
            const now = new Date();

            const options = {
                weekday: "short",
                year: "numeric",
                month: "short",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            };

            document.getElementById("liveDateTime").innerText =
                now.toLocaleDateString(undefined, options);
        }

        updateDateTime();
        setInterval(updateDateTime, 1000);


        /* FIREBASE */

        const firebaseConfig = {
            apiKey: "AIzaSyDKed-yuAcwqKqcL6fn2WnBhRPcq-PbDtU",
            authDomain: "strix-shop.firebaseapp.com",
            projectId: "strix-shop",
            storageBucket: "strix-shop.firebasestorage.app",
            messagingSenderId: "300414445622",
            appId: "1:300414445622:web:97465fa5309c27b9605097"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);


        /* AUTH PERSISTENCE */

        await setPersistence(auth, browserLocalPersistence);


        /* ENTRY / EXIT RECORDING */

        let lastWriteTimestamp = 0;

        async function getClientIP() {
            try {
                const response =
                    await fetch("https://api.ipify.org?format=json");

                const data = await response.json();

                return data.ip;

            } catch (error) {
                console.warn("Could not retrieve client IP:", error);
                return "Unavailable";
            }
        }


        async function recordEntryExit(user, type) {

            const nowMs = Date.now();

            if (nowMs - lastWriteTimestamp < 2000) {
                return false;
            }

            lastWriteTimestamp = nowMs;

            const userRecordRef =
                doc(db, "entryexit", user.uid);

            const now = new Date();

            const dateStr =
                now.toISOString().split("T")[0];

            const timeStr =
                now.toTimeString().split(" ")[0];

            const ipAddress =
                await getClientIP();

            const entryRecord = {
                date: dateStr,
                time: timeStr,
                fullTimestamp: now.toISOString(),
                ipAddress: ipAddress,
                eventAction: type
            };

            try {

                await setDoc(
                    userRecordRef,
                    {
                        userId: user.uid,
                        email: user.email,
                        records: arrayUnion(entryRecord)
                    },
                    { merge: true }
                );

                return true;

            } catch (error) {
                console.error(
                    "Could not record entry/exit:",
                    error
                );

                return false;
            }
        }


        /* TRANSITION SCREEN */

        function showTransitionState(messageText) {

            const cardContainer =
                document.getElementById("cardContainer");

            cardContainer.innerHTML = `
                <div class="py-12 text-center">

                    <div class="
                        inline-block
                        animate-spin
                        rounded-full
                        h-8
                        w-8
                        border-4
                        border-slate-800
                        border-t-transparent
                        mb-4
                    "></div>

                    <div class="
                        text-slate-800
                        font-semibold
                        text-lg
                        animate-pulse
                    ">
                        ${messageText}
                    </div>

                </div>
            `;
        }


        /* AUTH STATE */

        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log(
                    "Firebase authentication active:",
                    user.email
                );
            }
        });


        /* LOGIN (EMAIL / PASSWORD) */

        const loginForm =
            document.getElementById("loginForm");

        const errorDisplay =
            document.getElementById("error-display");

        const mainBtn =
            document.getElementById("mainBtn");

        const googleBtn =
            document.getElementById("googleBtn");


        loginForm.addEventListener("submit", async (e) => {

            e.preventDefault();

            errorDisplay.innerText = "";
            mainBtn.disabled = true;
            mainBtn.textContent = "Signing In...";


            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            try {

                await setPersistence(
                    auth,
                    browserLocalPersistence
                );

                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                await recordEntryExit(
                    userCredential.user,
                    "manual-entry"
                );

                showTransitionState(
                    "Sign-in Successful! Loading..."
                );

                setTimeout(() => {
                    window.location.replace("index.html");
                }, 1000);

            } catch (err) {

                console.error(
                    "Sign-in error:",
                    err
                );

                mainBtn.disabled = false;
                mainBtn.textContent = "Sign In";


                if (err.code === "auth/invalid-email") {

                    errorDisplay.innerText =
                        "Invalid email format.";

                } else if (
                    [
                        "auth/user-not-found",
                        "auth/wrong-password",
                        "auth/invalid-credential"
                    ].includes(err.code)
                ) {

                    errorDisplay.innerText =
                        "Incorrect email or password.";

                } else {

                    errorDisplay.innerText =
                        "Error: " + err.message;

                }

            }

        });


        /* GOOGLE SIGN-IN */

        googleBtn.addEventListener("click", async () => {
            errorDisplay.innerText = "";
            googleBtn.disabled = true;

            const provider = new GoogleAuthProvider();

            try {
                await setPersistence(auth, browserLocalPersistence);

                const result = await signInWithPopup(auth, provider);

                await recordEntryExit(result.user, "google-popup-entry");

                showTransitionState("Google Sign-in Successful! Loading...");

                setTimeout(() => {
                    window.location.replace("index.html");
                }, 1000);

            } catch (err) {
                console.error("Google sign-in error:", err);
                googleBtn.disabled = false;
                errorDisplay.innerText = "Google Sign-In failed: " + err.message;
            }
        });

    </script>

</body>
</html>
