<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal | Secure Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.22);
            --glass-highlight: rgba(255, 255, 255, 0.35);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --accent: #b19cd9;
            --accent-hover: #c5b4e3;
            --error: #ff6b6b;
            --success: #4ade80;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Quicksand', sans-serif !important; 
        }

        body, html {
            width: 100%; 
            height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: #0f0c1b;
        }

        /* Liquid Blurred Background */
        .bg-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0f0c1b;
            filter: blur(25px) saturate(150%);
            transform: scale(1.1);
            z-index: 0;
        }

        /* Floating dynamic lighting blobs for liquid feel */
        .liquid-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
            z-index: 1;
            pointer-events: none;
            animation: floatBlob 12s ease-in-out infinite alternate;
        }
        .blob-1 { top: -15%; left: -15%; width: 55vw; height: 55vw; background: #8e6fc2; }
        .blob-2 { bottom: -15%; right: -15%; width: 55vw; height: 55vw; background: #5c438c; animation-delay: -6s; }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(35px, 45px) scale(1.12); }
        }

        /* Main Glass Card container supporting split layout for mobile & desktop */
        .portal-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(26px) saturate(200%);
            -webkit-backdrop-filter: blur(26px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-left: 1px solid var(--glass-highlight);
            border-radius: 32px;
            padding: 36px 28px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45),
                        inset 0 1px 0 rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .header-content h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 1px;
        }
        .header-content p {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: 500;
        }

        /* Form Input Styles */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .input-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
            padding-left: 4px;
        }

        .text-input-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px 16px;
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
            transition: border-color 0.2s;
        }
        .text-input-box:focus {
            border-color: var(--accent);
        }
        .text-input-box::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Modern Pin Input Screen */
        .pin-display-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px;
            font-size: 1.4rem;
            letter-spacing: 10px;
            text-align: center;
            color: var(--text-main);
            outline: none;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        .key-element {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 10px 0;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-main);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            user-select: none;
        }

        .key-element:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--glass-highlight);
            transform: translateY(-1px);
        }
        .key-element:active {
            transform: translateY(0);
        }

        .key-subtext {
            font-size: 0.55rem;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-top: 1px;
            text-transform: uppercase;
        }

        .action-key {
            background: rgba(177, 156, 217, 0.12);
            color: var(--accent);
            border-color: rgba(177, 156, 217, 0.3);
        }
        .action-key:hover {
            background: rgba(177, 156, 217, 0.25);
        }

        .clear-key {
            color: var(--error);
            background: rgba(255, 107, 107, 0.12);
            border-color: rgba(255, 107, 107, 0.3);
        }
        .clear-key:hover {
            background: rgba(255, 107, 107, 0.25);
        }

        .feedback-message {
            font-size: 0.8rem;
            font-weight: 700;
            height: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="bg-layer"></div>
    <div class="liquid-blob blob-1"></div>
    <div class="liquid-blob blob-2"></div>

    <div class="portal-wrapper">
        <div class="glass-card">
            <div class="header-content">
                <h1>EMPLOYEE PORTAL</h1>
                <p>Enter your work email & 4-digit PIN</p>
            </div>

            <!-- Email Input Field -->
            <div class="input-group">
                <label class="input-label" for="employeeEmail">Employee Email</label>
                <input type="email" id="employeeEmail" class="text-input-box" placeholder="harrypotter@hogwarts.edu" autocomplete="email">
            </div>

            <!-- PIN Display Box -->
            <div class="input-group">
                <label class="input-label" for="securePinDisplay">4-Digit Security PIN</label>
                <input type="password" id="securePinDisplay" class="pin-display-box" readonly maxlength="4" placeholder="••••">
            </div>

            <div class="feedback-message" id="feedbackMsg"></div>

            <!-- Interactive Keypad -->
            <div class="keypad-grid">
                <button type="button" class="key-element" onclick="window.handleKey('1')">1<span class="key-subtext">&nbsp;</span></button>
                <button type="button" class="key-element" onclick="window.handleKey('2')">2<span class="key-subtext">abc</span></button>
                <button type="button" class="key-element" onclick="window.handleKey('3')">3<span class="key-subtext">def</span></button>
                
                <button type="button" class="key-element" onclick="window.handleKey('4')">4<span class="key-subtext">ghi</span></button>
                <button type="button" class="key-element" onclick="window.handleKey('5')">5<span class="key-subtext">jkl</span></button>
                <button type="button" class="key-element" onclick="window.handleKey('6')">6<span class="key-subtext">mno</span></button>
                
                <button type="button" class="key-element" onclick="window.handleKey('7')">7<span class="key-subtext">pqrs</span></button>
                <button type="button" class="key-element" onclick="window.handleKey('8')">8<span class="key-subtext">tuv</span></button>
                <button type="button" class="key-element" onclick="window.handleKey('9')">9<span class="key-subtext">wxyz</span></button>
                
                <button type="button" class="key-element clear-key" onclick="window.clearInput()">CLR</button>
                <button type="button" class="key-element" onclick="window.handleKey('0')">0<span class="key-subtext">&nbsp;</span></button>
                <button type="button" class="key-element action-key" onclick="window.deleteInput()">⌫</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyArPb4CyEgpjHSF4ePyE2NE7RY4P5GxPks",
            authDomain: "ssap-00.firebaseapp.com",
            projectId: "ssap-00",
            storageBucket: "ssap-00.firebasestorage.app",
            messagingSenderId: "914204702517",
            appId: "1:914204702517:web:d4bd735de25e74db8e3e7c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let pinBuffer = "";

        window.handleKey = function(digit) {
            if (pinBuffer.length < 4) {
                pinBuffer += digit;
                renderDisplay();
                if (pinBuffer.length === 4) {
                    authenticateUser();
                }
            }
        };

        window.deleteInput = function() {
            pinBuffer = pinBuffer.slice(0, -1);
            renderDisplay();
            document.getElementById('feedbackMsg').innerText = "";
        };

        window.clearInput = function() {
            pinBuffer = "";
            renderDisplay();
            document.getElementById('feedbackMsg').innerText = "";
        };

        function renderDisplay() {
            document.getElementById('securePinDisplay').value = pinBuffer;
        }

        async function authenticateUser() {
            const emailInput = document.getElementById('employeeEmail').value.trim();
            const feedbackEl = document.getElementById('feedbackMsg');

            if (!emailInput) {
                feedbackEl.style.color = "var(--error)";
                feedbackEl.innerText = "Please enter your email first.";
                pinBuffer = "";
                renderDisplay();
                return;
            }

            feedbackEl.style.color = "var(--text-dim)";
            feedbackEl.innerText = "Authenticating...";

            // Append '00' to meet Firebase's 6-character password constraint
            const paddedPassword = pinBuffer + "00";

            try {
                const userCredential = await signInWithEmailAndPassword(auth, emailInput, paddedPassword);
                const user = userCredential.user;

                feedbackEl.style.color = "var(--success)";
                feedbackEl.innerText = "Password Correct. Redirecting...";

                // Save session context
                sessionStorage.setItem("activeEmployeeEmail", user.email);
                sessionStorage.setItem("activeEmployeeUid", user.uid);

                setTimeout(() => {
                    window.location.href = "aphome.html";
                }, 800);

            } catch (error) {
                console.error("Firebase Auth Error:", error.code);
                feedbackEl.style.color = "var(--error)";
                
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    feedbackEl.innerText = "Invalid email or PIN.";
                } else if (error.code === 'auth/invalid-email') {
                    feedbackEl.innerText = "Invalid email format.";
                } else {
                    feedbackEl.innerText = "Authentication failed. Try again.";
                }

                setTimeout(() => {
                    pinBuffer = "";
                    renderDisplay();
                    feedbackEl.innerText = "";
                }, 1200);
            }
        }
    </script>
</body>
</html>
