<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strix Shop | Market Research</title>
    <link rel="icon" type="image/png" href="logospfd.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #484976;
            --primary-hover: #4338ca;
            --surface: rgba(255, 255, 255, 0.18);
            --text-main: #0f172a;
            --text-dim: #475569;
            --border: rgba(255, 255, 255, 0.55);
            --nav-dark: #0a0c12;
            --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.8), inset 0 -1px 2px rgba(0, 0, 0, 0.05);
            --radius-main: 32px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            background: linear-gradient(-45deg, #e0e7ff, #f0fdf4, #e0f2fe, #f3e8ff);
            background-size: 400% 400%;
            animation: fluidBackground 18s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            color: var(--text-main);
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        @keyframes fluidBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .help-hero {
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .support-panel {
            opacity: 0;
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        /* NAVIGATION BAR */
        nav {
            background: var(--nav-dark);
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .nav-main {
            display: flex;
            align-items: center;
            padding: 14px 5%;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-box img {
            height: 32px;
            cursor: pointer;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-box img:hover {
            transform: scale(1.04);
        }

        .nav-right-actions {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: color 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-link-item svg {
            stroke: #cbd5e1;
            transition: stroke 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-link-item:hover {
            color: #ffffff;
        }

        .nav-link-item:hover svg {
            stroke: #ffffff;
        }

        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-badge-text {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        /* HERO SECTION */
        .help-hero {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 20px 20px 20px;
        }

        .help-hero h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #1e1b4b;
            margin-bottom: 10px;
        }

        .help-subtext {
            max-width: 600px;
            margin: 0 auto;
            color: var(--text-dim);
            font-size: 14px;
            line-height: 1.6;
            font-weight: 600;
        }

        /* CONTAINER & FORM PANEL */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1100px;
            margin: 0 auto 40px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        .support-panel {
            background: var(--surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-main);
            padding: 25px;
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 10px;
            transition: background 0.35s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .support-panel:hover {
            background: rgba(255, 255, 255, 0.28);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12), inset 0 1px 3px rgba(255, 255, 255, 0.9);
        }

        .iframe-wrapper {
            width: 100%;
            height: 750px;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* FOOTER */
        footer {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 850px) {
            .help-hero h1 {
                font-size: 26px;
            }
            .iframe-wrapper {
                height: 600px;
            }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-main">
        <div class="logo-box" onclick="window.location.href='home.html'">
            <img src="logoh.png" alt="STRIX">
        </div>
        <div class="nav-right-actions">
            <a href="home.html" class="nav-link-item">
                <svg width="15" height="15" fill="none" stroke-width="2.2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Home
            </a>
            <div class="nav-divider"></div>
            <span class="nav-badge-text">Market Research</span>
        </div>
    </div>
</nav>

<section class="help-hero">
    <h1>Market Research</h1>
    <p class="help-subtext">
        Help us improve Strix Shop by sharing your thoughts below.
    </p>
</section>

<main class="container">
    <section class="support-panel">
        <div class="iframe-wrapper">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScBpBBby67K5x-qKPlhms6kkcGiGCeyKFe4MwiAJj2s-W5HMA/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
        </div>
    </section>
</main>

<footer>
    &copy; 2026 STRIX SHOP. ALL RIGHTS RESERVED.
</footer>

</body>
</html>
