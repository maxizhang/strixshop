<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="spfd.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strix Shop | Market Research</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #484976;
            --primary-hover: #4f4c74;
            --surface: rgba(255, 255, 255, 0.28);
            --surface-hover: rgba(255, 255, 255, 0.38);
            --text-main: #0f172a;
            --text-dim: #475569;
            --border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.8), inset 0 -1px 2px rgba(0, 0, 0, 0.05);
            --radius-main: 32px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Quicksand', sans-serif; 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.6;
            position: relative;
        }

        /* Background Layer with Random Image Support */
        .bg-layer {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.65;
            z-index: -2;
            transition: all 1s ease-in-out;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(240, 244, 248, 0.75), rgba(224, 231, 255, 0.75));
            z-index: -1;
        }

        /* Entrance Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }

        /* Navigation Bar */
        nav {
            background: rgba(0, 0, 0, 0.75);
            height: 60px;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
        }

        .nav-main {
            display: flex;
            align-items: center;
            padding: 0 5%;
            justify-content: space-between;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-box img {
            height: 28px;
            cursor: pointer;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-box img:hover {
            transform: scale(1.04);
        }

        .nav-right-actions {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: color 0.25s ease;
        }

        .nav-link-item svg {
            stroke: #cbd5e1;
            transition: stroke 0.25s ease;
        }

        .nav-link-item:hover {
            color: #ffffff;
        }

        .nav-link-item:hover svg {
            stroke: #ffffff;
        }

        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-badge-text {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        /* Hero Section */
        .help-hero {
            text-align: center;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        .help-hero h1 { 
            font-size: 32px; 
            font-weight: 700; 
            margin: 0 0 10px; 
            color: #1e1b4b; 
            letter-spacing: -0.5px; 
        }

        .help-subtext {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dim);
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Main Container & Support Panel */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
            flex: 1;
        }

        .support-panel {
            background: var(--surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-main);
            padding: 30px;
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.35s cubic-bezier(0.4, 0, 0.2, 1), background 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .support-panel:hover {
            background: var(--surface-hover);
            transform: translateY(-4px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12), inset 0 1px 3px rgba(255, 255, 255, 0.9);
        }

        .iframe-wrapper {
            width: 100%;
            height: 750px;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 10;
        }

        @media (max-width: 850px) {
            .help-hero h1 { font-size: 26px; }
            .iframe-wrapper { height: 600px; }
            .container { width: 95%; margin: 25px auto; }
            .support-panel { padding: 20px; border-radius: 24px; }
        }
    </style>
</head>
<body>

    <!-- Background Layer & Overlay -->
    <div class="bg-layer" id="bgLayer"></div>
    <div class="bg-overlay"></div>

    <nav>
        <div class="nav-main">
            <div class="logo-box" onclick="window.location.href='mr.html'">
                <img src="logoh.png" alt="STRIX">
            </div>
            <div class="nav-right-actions">
                <a href="index.html" class="nav-link-item">
                    <svg width="15" height="15" fill="none" stroke-width="2.2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Home
                </a>
                <div class="nav-divider"></div>
                <span class="nav-badge-text">Market Research</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <section class="help-hero animate-in delay-1">
            <h1>Market Research</h1>
            <p class="help-subtext">
                Help us improve Strix Shop by sharing your thoughts below.
            </p>
        </section>

        <section class="support-panel animate-in delay-2">
            <div class="iframe-wrapper">
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScBpBBby67K5x-qKPlhms6kkcGiGCeyKFe4MwiAJj2s-W5HMA/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
            </div>
        </section>
    </div>

    <footer>
        &copy; 2026 STRIX SHOP. ALL RIGHTS RESERVED.
    </footer>

    <!-- Random Background Image Loader -->
    <script>
        const n = Math.floor(Math.random() * 12) + 1;
        const bgLayer = document.getElementById("bgLayer");
        const img = new Image();
        img.src = `bg${n}.png`;
        img.onload = () => bgLayer.style.backgroundImage = `url('${img.src}')`;
    </script>
</body>
</html>
