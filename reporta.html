<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strix Shop | Reports</title>
    <link rel="icon" type="image/png" href="logospfd.png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --surface: rgba(255, 255, 255, 0.18);
            --text-main: #0f172a;
            --text-dim: #475569;
            --border: rgba(255, 255, 255, 0.55);
            --nav-dark: #0a0c12;
            --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.8), inset 0 -1px 2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(-45deg, #e0e7ff, #f0fdf4, #e0f2fe, #f3e8ff);
            background-size: 400% 400%;
            animation: fluidBackground 20s ease infinite;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @keyframes fluidBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Professional Navbar */
        nav {
            background: var(--nav-dark);
            width: 100%;
            position: relative;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .nav-main {
            display: flex;
            align-items: center;
            padding: 14px 5%;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-box img {
            height: 32px;
            cursor: pointer;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        .nav-right-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: color 0.2s;
        }

        .nav-link-item svg {
            stroke: #cbd5e1;
            transition: stroke 0.2s;
        }

        .nav-link-item:hover {
            color: #ffffff;
        }

        .nav-link-item:hover svg {
            stroke: #ffffff;
        }

        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-badge-text {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        /* Feed Layout */
        .feed-container {
            position: relative;
            z-index: 10;
            flex: 1;
            overflow-y: auto;
            padding: 40px 5%;
            display: flex;
            flex-direction: column;
            gap: 25px;
            scroll-behavior: smooth;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        /* Timeline vertical line */
        .feed-container::before {
            content: '';
            position: absolute;
            left: calc(5% + 20px);
            top: 0; bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, transparent, rgba(79, 70, 229, 0.2), transparent);
        }

        .report-packet {
            position: relative;
            margin-left: 50px;
            background: var(--surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1.5px solid var(--border);
            border-radius: 28px;
            padding: 30px;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
            box-shadow: var(--glass-shadow);
        }

        .report-packet:hover {
            background: rgba(255, 255, 255, 0.28);
            transform: translateY(-4px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12), inset 0 1px 3px rgba(255, 255, 255, 0.9);
            border-color: var(--primary);
        }

        /* Timeline Dot */
        .packet-dot {
            position: absolute;
            left: -37px; top: 35px;
            width: 12px; height: 12px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(79, 70, 229, 0.4);
        }

        .packet-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            padding-bottom: 12px;
        }

        .category-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(79, 70, 229, 0.15);
            font-weight: 700;
        }

        .timestamp { 
            font-size: 12px; 
            color: var(--text-dim); 
            font-family: 'JetBrains Mono', monospace; 
            font-weight: 600;
        }
        
        .subject { 
            font-size: 18px; 
            font-weight: 700; 
            margin-bottom: 10px; 
            color: #1e1b4b; 
        }

        .details { 
            font-size: 14px; 
            line-height: 1.6; 
            color: var(--text-dim); 
            font-weight: 500;
        }

        .reporter-info {
            margin-top: 15px;
            font-size: 11px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            padding-top: 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }

        .empty-state {
            text-align: center; 
            margin-top: 100px; 
            color: var(--text-dim);
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 1px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 10px; }
    </style>
</head>
<body>

<nav>
    <div class="nav-main">
        <div class="logo-box" onclick="window.location.href='home.html'">
            <img src="logoh.png" alt="STRIX">
        </div>
        <div class="nav-right-actions">
            <a href="home.html" class="nav-link-item">
                <svg width="15" height="15" fill="none" stroke-width="2.2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Home
            </a>
            <div class="nav-divider"></div>
            <span class="nav-badge-text" id="admin-id">REVIEW REPORTS</span>
        </div>
    </div>
</nav>

<div class="feed-container" id="reports-feed">
    <div class="empty-state">SYNCING DATA...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyDKed-yuAcwqKqcL6fn2WnBhRPcq-PbDtU", 
        authDomain: "strix-shop.firebaseapp.com", 
        projectId: "strix-shop" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    auth.onAuthStateChanged(async (user) => {
        if (!user) { window.location.href = "index.html"; return; }

        const userDoc = await db.collection("users").doc(user.uid).get();
        const isAdmin = user.uid === "PNssYZn1wNUGjmzeAq1eHz2QHKf1";

        if (userDoc.exists && (userDoc.data().acc === "admin" || isAdmin)) {
            listenToReports();
        } else {
            alert("ACCESS DENIED");
            window.location.href = "home.html";
        }
    });

    // 2. LIVE FEED LISTENER
    function listenToReports() {
        db.collection("reports").orderBy("timestamp", "desc").onSnapshot(snap => {
            const feed = document.getElementById('reports-feed');
            feed.innerHTML = '';

            if (snap.empty) {
                feed.innerHTML = '<div class="empty-state">NO CURRENT REPORTS IN DATABASE.</div>';
                return;
            }

            snap.forEach(doc => {
                const data = doc.data();
                const time = data.timestamp ? data.timestamp.toDate().toLocaleString() : 'Just now';
                
                const packet = document.createElement('div');
                packet.className = 'report-packet';
                packet.innerHTML = `
                    <div class="packet-dot"></div>
                    <div class="packet-header">
                        <span class="category-tag">${data.category}</span>
                        <span class="timestamp">${time}</span>
                    </div>
                    <div class="subject">${data.subject}</div>
                    <div class="details">${data.details}</div>
                    <div class="reporter-info">SOURCE: ${data.email} // ID: ${data.uid.substring(0,12)}</div>
                `;
                feed.appendChild(packet);
            });
        });
    }
</script>
</body>
</html>
