<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strix Shop | Customer Stories</title>
    <link rel="icon" type="image/png" href="logospfd.png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #484976;
            --primary-hover: #646093;
            --surface: rgba(255, 255, 255, 0.22);
            --text-main: #0f172a;
            --text-dim: #475569;
            --border: rgba(255, 255, 255, 0.65);
            --border-subtle: rgba(226, 232, 240, 0.4);
            --nav-dark: #0a0c12;
            --glass-shadow: 0 25px 50px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.9), inset 0 -1px 2px rgba(0, 0, 0, 0.05);
            --star-active: #f59e0b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            margin: 0;
            background: linear-gradient(-45deg, #e0e7ff, #f0fdf4, #e0f2fe, #f3e8ff);
            background-size: 400% 400%;
            animation: fluidBackground 18s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes fluidBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animated Background Glowing Orbs */
        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(129, 140, 248, 0.4);
            top: -10%;
            left: -10%;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(167, 243, 208, 0.4);
            bottom: -20%;
            right: -10%;
            animation-delay: -4s;
        }

        .orb-3 {
            width: 350px;
            height: 350px;
            background: rgba(244, 114, 182, 0.25);
            top: 40%;
            left: 30%;
            animation-delay: -8s;
        }

        @keyframes floatOrb {
            0% { transform: translateY(0px) translateX(0px) scale(1); }
            100% { transform: translateY(40px) translateX(30px) scale(1.1); }
        }

        /* Entrance Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }

        nav {
            background: var(--nav-dark);
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .nav-main {
            display: flex;
            align-items: center;
            padding: 14px 5%;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-box img {
            height: 32px;
            cursor: pointer;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
            transition: transform 0.2s ease;
        }
        .logo-box img:hover {
            transform: scale(1.05);
        }

        .nav-right-actions {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: color 0.2s;
        }

        .nav-link-item svg {
            stroke: #cbd5e1;
            transition: stroke 0.2s;
        }

        .nav-link-item:hover {
            color: #ffffff;
        }

        .nav-link-item:hover svg {
            stroke: #ffffff;
        }

        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-badge-text {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 900px;
            margin: 0 auto;
        }

        .header-simple {
            padding: 50px 0 10px 0;
        }

        .header-section {
            background: var(--surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1.5px solid var(--border);
            border-radius: 32px;
            padding: 40px;
            box-shadow: var(--glass-shadow);
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 12px;
            color: #1e1b4b;
            letter-spacing: -0.5px;
        }

        .header-description {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dim);
            line-height: 1.6;
            max-width: 650px;
            margin: 0 auto;
        }

        /* Horizontal Carousel Section */
        .carousel-wrapper {
            position: relative;
            z-index: 10;
            max-width: 1000px;
            width: 90%;
            margin: 40px auto 80px auto;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .carousel-container {
            display: flex;
            gap: 30px;
            overflow-x: auto;
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
            padding: 20px 10px;
            width: 100%;
        }

        .carousel-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .story-packet {
            flex: 0 0 100%;
            max-width: 100%;
            scroll-snap-align: center;
            background: var(--surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1.5px solid var(--border);
            border-radius: 28px;
            padding: 35px;
            box-shadow: var(--glass-shadow);
            transition: transform 0.4s ease, box-shadow 0.4s ease, background 0.4s ease;
        }

        .story-packet:hover {
            background: rgba(255, 255, 255, 0.32);
            box-shadow: 0 35px 70px rgba(97, 87, 181, 0.15), inset 0 1px 3px rgba(255, 255, 255, 0.95);
            border-color: var(--primary);
        }

        .packet-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            padding-bottom: 12px;
        }

        .category-tag {
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--primary);
            background: rgba(72, 73, 118, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(72, 73, 118, 0.15);
            font-weight: 700;
        }

        .timestamp { 
            font-size: 12px; 
            color: var(--text-dim); 
            font-weight: 600;
        }

        .subject { 
            font-size: 18px; 
            font-weight: 700; 
            margin-bottom: 6px; 
            color: #1e1b4b; 
        }

        .stars-display {
            color: var(--star-active);
            font-size: 16px;
            margin-bottom: 12px;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .survey-breakdown {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 15px;
            background: rgba(255, 255, 255, 0.35);
            padding: 14px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            font-weight: 600;
        }

        .survey-item span {
            font-weight: 700;
            color: #1e1b4b;
        }

        .details { 
            font-size: 13px; 
            line-height: 1.6; 
            color: var(--text-dim); 
            font-weight: 600;
            background: rgba(255, 255, 255, 0.5);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .customer-meta {
            margin-top: 15px;
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 700;
            padding-top: 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            letter-spacing: 0.5px;
        }

        /* Navigation Arrows */
        .carousel-btn {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1.5px solid var(--border);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--glass-shadow);
            color: var(--primary);
            transition: all 0.2s ease;
            flex-shrink: 0;
            z-index: 20;
        }

        .carousel-btn:hover {
            background: var(--primary);
            color: #ffffff;
            transform: scale(1.08);
        }

        .carousel-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
        }

        .empty-state {
            text-align: center; 
            margin: 0 auto; 
            color: var(--text-dim);
            font-weight: 700;
            letter-spacing: 1px;
            background: var(--surface);
            backdrop-filter: blur(40px);
            border: 1.5px solid var(--border);
            border-radius: 28px;
            padding: 40px;
            box-shadow: var(--glass-shadow);
            width: 100%;
        }

        footer {
            text-align: center;
            padding: 25px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
            position: relative;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .carousel-wrapper {
                flex-direction: column;
            }
            .carousel-btn {
                display: none;
            }
            .survey-breakdown {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Animated background glowing orbs -->
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <nav>
        <div class="nav-main">
            <div class="logo-box" onclick="window.location.href='home.html'">
                <img src="logoh.png" alt="STRIX">
            </div>
            <div class="nav-right-actions">
                <a href="home.html" class="nav-link-item">
                    <svg width="15" height="15" fill="none" stroke-width="2.2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Home
                </a>
                <div class="nav-divider"></div>
                <span class="nav-badge-text">Customer Stories</span>
            </div>
        </div>
    </nav>

    <section class="header-simple animate-in delay-1">
        <div class="container">
            <div class="header-section">
                <h1>Customer Stories & Feedback</h1>
                <p class="header-description">
                    Browse through community ratings and complete order feedback in an endless interactive showcase.
                </p>
            </div>
        </div>
    </section>

    <!-- Carousel Section with Left/Right Arrows -->
    <div class="carousel-wrapper animate-in delay-2">
        <button class="carousel-btn" id="prevBtn" onclick="scrollCarousel(-1)">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>

        <div class="carousel-container" id="reviews-carousel">
            <div class="empty-state">LOADING CUSTOMER STORIES...</div>
        </div>

        <button class="carousel-btn" id="nextBtn" onclick="scrollCarousel(1)">
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
    </div>

    <footer>
        &copy; 2026 STRIX SHOP. ALL RIGHTS RESERVED.
    </footer>

    <!-- Firebase SDKs (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDKed-yuAcwqKqcL6fn2WnBhRPcq-PbDtU", 
            authDomain: "strix-shop.firebaseapp.com", 
            projectId: "strix-shop",
            storageBucket: "strix-shop.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let reviewDocs = [];
        let autoScrollInterval = null;

        function loadCustomerStories() {
            db.collection("reviews").orderBy("timestamp", "desc").onSnapshot(snap => {
                const carousel = document.getElementById('reviews-carousel');
                carousel.innerHTML = '';

                if (snap.empty) {
                    carousel.innerHTML = '<div class="empty-state">NO CUSTOMER STORIES RECORDED YET. CHECK BACK SOON!</div>';
                    return;
                }

                reviewDocs = [];
                snap.forEach(doc => reviewDocs.push(doc.data()));

                renderCarouselCards();
                startInfiniteAutoScroll();
            }, (error) => {
                console.error("Error loading public stories:", error);
                document.getElementById('reviews-carousel').innerHTML = '<div class="empty-state">UNABLE TO LOAD STORIES AT THE MOMENT.</div>';
            });
        }

        function renderCarouselCards() {
            const carousel = document.getElementById('reviews-carousel');
            carousel.innerHTML = '';

            reviewDocs.forEach(data => {
                const time = data.timestamp ? data.timestamp.toDate().toLocaleDateString() : 'Recent';
                const ratingCount = data.overallRating || 5;
                const starsHtml = '★'.repeat(ratingCount) + '☆'.repeat(5 - ratingCount);
                const survey = data.survey || {};

                let displayUser = "Verified Customer";
                if (data.userEmail) {
                    const parts = data.userEmail.split('@');
                    if (parts.length === 2) {
                        displayUser = parts[0].substring(0, 2) + "***@" + parts[1];
                    }
                }

                const packet = document.createElement('div');
                packet.className = 'story-packet';
                packet.innerHTML = `
                    <div class="packet-header">
                        <span class="category-tag">Community Story</span>
                        <span class="timestamp">${time}</span>
                    </div>
                    <div class="subject">${data.productName || "Strix Shop Item"}</div>
                    <div class="stars-display">${starsHtml} <span style="font-size: 13px; color: var(--text-dim); font-weight: 600;">(${ratingCount}/5)</span></div>
                    
                    <div class="survey-breakdown">
                        <div class="survey-item"><span>Match Desc:</span> ${survey.q1MatchDesc || 'N/A'}</div>
                        <div class="survey-item"><span>Quality:</span> ${survey.q2Quality || 'N/A'}</div>
                        <div class="survey-item"><span>Packaging:</span> ${survey.q3Packaging || 'N/A'}</div>
                        <div class="survey-item"><span>Delivery:</span> ${survey.q4Delivery || 'N/A'}</div>
                        <div class="survey-item"><span>Value:</span> ${survey.q5Value || 'N/A'}</div>
                        <div class="survey-item"><span>Buy Again:</span> ${survey.q6BuyAgain || 'N/A'}</div>
                        <div class="survey-item" style="grid-column: span 2;"><span>Recommend:</span> ${survey.q7Recommend || 'N/A'}</div>
                    </div>

                    <div class="details">"${data.comment || 'The customer left a rating without additional written comments.'}"</div>
                    
                    <div class="customer-meta">
                        <span>CUSTOMER: ${displayUser}</span>
                    </div>
                `;
                carousel.appendChild(packet);
            });
        }

        // Manual arrow controls
        function scrollCarousel(direction) {
            const carousel = document.getElementById('reviews-carousel');
            const cardWidth = carousel.querySelector('.story-packet')?.clientWidth || 300;
            carousel.scrollBy({ left: direction * (cardWidth + 30), behavior: 'smooth' });
        }

        // Endless smooth loop implementation
        function startInfiniteAutoScroll() {
            if (autoScrollInterval) clearInterval(autoScrollInterval);

            autoScrollInterval = setInterval(() => {
                const carousel = document.getElementById('reviews-carousel');
                if (!carousel || reviewDocs.length <= 1) return;

                const cardWidth = carousel.querySelector('.story-packet')?.clientWidth || 300;
                const maxScrollLeft = carousel.scrollWidth - carousel.clientWidth;

                if (carousel.scrollLeft >= maxScrollLeft - 10) {
                    // Instantly wrap back to the beginning when hitting the end
                    carousel.scrollTo({ left: 0, behavior: 'auto' });
                } else {
                    carousel.scrollBy({ left: cardWidth + 30, behavior: 'smooth' });
                }
            }, 4500); // Transitions to next review every 4.5 seconds
        }

        // Pause auto-scroll on mouse hover so users can easily read details
        const wrapper = document.querySelector('.carousel-wrapper');
        wrapper.addEventListener('mouseenter', () => clearInterval(autoScrollInterval));
        wrapper.addEventListener('mouseleave', () => startInfiniteAutoScroll());

        loadCustomerStories();
    </script>
</body>
</html>
