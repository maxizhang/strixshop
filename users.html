<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strix Shop | Personnel Database</title>
    <link rel="icon" type="image/png" href="logospfd.png">
    <!-- Rounded Font: Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6157b5;
            --primary-hover: #4338ca;
            --surface: rgba(255, 255, 255, 0.75);
            --surface-card: rgba(255, 255, 255, 0.6);
            --text-main: #0f172a;
            --text-dim: #475569;
            --border: rgba(255, 255, 255, 0.9);
            --border-subtle: rgba(203, 213, 225, 0.4);
            --nav-dark: #0a0c12;
            --error: #ef4444;
            --glass-shadow: 0 20px 40px rgba(79, 70, 229, 0.06), inset 0 1px 2px rgba(255, 255, 255, 0.9);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Quicksand', sans-serif; 
        }

        body { 
            background: linear-gradient(-45deg, #e0e7ff, #f0fdf4, #e0f2fe, #f3e8ff);
            background-size: 400% 400%;
            animation: fluidBackground 20s ease infinite;
            color: var(--text-main); 
            min-height: 100vh; 
            overflow-x: hidden;
        }

        @keyframes fluidBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        a {
            text-decoration: none;
            font-weight: 700;
            color: #64748b;
            transition: color 0.2s;
        }
        a:hover {
            color: #334155;
        }

        nav { 
            background: var(--nav-dark); 
            width: 100%; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .nav-main { 
            display: flex; 
            align-items: center; 
            padding: 14px 5%; 
            justify-content: space-between; 
            max-width: 1400px;
            margin: 0 auto;
        }
        .logo-box img { 
            height: 32px; 
            cursor: pointer; 
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); 
        }
        .nav-right-actions {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .nav-link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: color 0.2s;
        }
        .nav-link-item svg {
            stroke: #cbd5e1;
            transition: stroke 0.2s;
        }
        .nav-link-item:hover {
            color: #ffffff;
        }
        .nav-link-item:hover svg {
            stroke: #ffffff;
        }
        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
        }
        .nav-badge-text {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
            background: var(--surface);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1.5px solid var(--border);
            border-radius: 28px;
            padding: 35px;
            box-shadow: var(--glass-shadow);
        }

        .table-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .table-title-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .table-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e1b4b;
        }

        /* Search Bar Styling */
        .search-box {
            position: relative;
            flex: 1;
            max-width: 320px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 38px;
            background: rgba(255, 255, 255, 0.8);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .search-box input:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
        }
        .search-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--text-dim);
            pointer-events: none;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
        }
        th { 
            text-align: left; 
            font-size: 11px; 
            color: var(--primary); 
            padding: 12px 15px; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            border-bottom: 1.5px solid var(--border-subtle);
            font-weight: 700;
        }
        td { 
            padding: 14px 15px; 
            border-bottom: 1px solid var(--border-subtle); 
            font-size: 13px; 
            font-weight: 600;
            color: var(--text-main);
        }
        tr:hover td { 
            background: rgba(79, 70, 229, 0.04); 
            cursor: pointer; 
        }

        .pfp-mini { 
            width: 34px; 
            height: 34px; 
            border-radius: 50%; 
            background-size: cover; 
            background-position: center;
            border: 1px solid var(--primary); 
        }

        /* Status Badges */
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }
        .badge-customer { background: rgba(100, 116, 139, 0.12); color: #475569; }
        .badge-pro { background: rgba(14, 165, 233, 0.12); color: #0284c7; }
        .badge-premium { background: rgba(168, 85, 247, 0.12); color: #9333ea; }
        .badge-admin { background: rgba(239, 68, 68, 0.12); color: #dc2626; }
        .badge-status { background: rgba(16, 185, 129, 0.12); color: #059669; }

        .sidebar {
            position: fixed; 
            top: 0; 
            right: -550px;
            width: 550px; 
            height: 100vh;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 1.5px solid var(--border);
            z-index: 2000;
            display: flex; 
            flex-direction: column;
            box-shadow: -20px 0 40px rgba(0, 0, 0, 0.08);
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .sidebar.open { 
            transform: translateX(-550px); 
        }

        .dossier-top {
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 25px;
            border-bottom: 1.5px solid var(--border-subtle);
        }
        .pfp-large {
            width: 100px; height: 100px;
            border-radius: 50%;
            background-size: cover; background-position: center;
            border: 2px solid var(--primary);
            flex-shrink: 0;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.2);
        }
        .top-info { flex: 1; }
        .top-info h2 { font-size: 22px; font-weight: 700; margin-bottom: 5px; color: #1e1b4b; }
        .uid-tag { font-family: 'Quicksand', monospace; font-size: 11px; color: var(--text-dim); }

        .sidebar-content { flex: 1; overflow-y: auto; padding: 25px 30px; }
        .close-trigger { 
            position: absolute; 
            right: 25px; 
            top: 20px; 
            font-size: 26px; 
            cursor: pointer; 
            color: var(--text-dim); 
            font-weight: 700;
            transition: color 0.2s; 
        }
        .close-trigger:hover { color: var(--text-main); }

        .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .field { 
            background: var(--surface-card); 
            padding: 12px 16px; 
            border-radius: 16px; 
            border: 1.5px solid var(--border);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .full-width { grid-column: span 2; }
        .label { font-size: 10px; color: var(--primary); font-weight: 700; margin-bottom: 4px; letter-spacing: 1px; }
        .value { outline: none; font-size: 13px; color: var(--text-main); font-weight: 600; display: block; word-break: break-all; min-height: 18px; }
        .value[contenteditable="true"]:hover {
            background: rgba(79, 70, 229, 0.05);
            border-radius: 4px;
            padding: 2px 4px;
            margin: -2px -4px;
        }

        .history-section {
            margin-top: 20px;
            background: var(--surface-card);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 16px;
        }
        .history-title {
            font-size: 10px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .history-item {
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-footer { 
            padding: 20px 30px; 
            border-top: 1.5px solid var(--border-subtle);
            display: flex; 
            gap: 12px;
            background: rgba(255, 255, 255, 0.5);
        }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 14px;
            font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.2s;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .save-btn { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .save-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .delete-btn { background: transparent; border: 1.5px solid var(--error); color: var(--error); }
        .delete-btn:hover { background: rgba(239, 68, 68, 0.08); transform: translateY(-1px); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; right: -100%; }
            .sidebar.open { transform: translateX(-100%); }
            .field-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .table-header-bar { flex-direction: column; align-items: stretch; }
            .search-box { max-width: 100%; }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-main">
        <div class="logo-box" onclick="window.location.href='home.html'"><img src="logoh.png" alt="STRIX"></div>
        <div class="nav-right-actions">
            <a href="home.html" class="nav-link-item">
                <svg width="15" height="15" fill="none" stroke-width="2.2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Home
            </a>
            <div class="nav-divider"></div>
            <span class="nav-badge-text">Personnel Database</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="table-header-bar">
        <div class="table-title-wrapper">
            <div class="table-title">Personnel Records</div>
            <div id="count" style="font-family:'Quicksand', monospace; font-size:11px; color:var(--primary); font-weight:700;">TOTAL USERS: 0</div>
        </div>
        <!-- Search Bar Input -->
        <div class="search-box">
            <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
            <input type="text" id="searchInput" placeholder="Search by name, email, ID..." oninput="filterTable()">
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th></th>
                <th>Name</th>
                <th>Email</th>
                <th>Status</th>
                <th>Latest Sign-In Activity</th>
            </tr>
        </thead>
        <tbody id="body"></tbody>
    </table>
</div>

<div class="sidebar" id="sidebar">
    <div class="close-trigger" onclick="closeSidebar()">×</div>
    
    <div class="dossier-top">
        <div class="pfp-large" id="side-pfp"></div>
        <div class="top-info">
            <h2 id="side-name">Name</h2>
            <div class="uid-tag" id="side-uid">UID: ---</div>
            <div id="side-acc-tag" style="margin-top:8px;"></div>
        </div>
    </div>

    <div class="sidebar-content">
        <div class="field-grid" id="fields-container"></div>
        
        <div class="history-section">
            <div class="history-title">Entry/Exit Records</div>
            <div class="history-list" id="side-history-list">
                <div style="font-size: 12px; color: var(--text-dim);">Loading records...</div>
            </div>
        </div>
    </div>

    <div class="sidebar-footer">
        <button class="btn delete-btn" onclick="deleteAccount()">Delete User</button>
        <button class="btn save-btn" onclick="save()">Publish Changes</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
firebase.initializeApp({
    apiKey: "AIzaSyDKed-yuAcwqKqcL6fn2WnBhRPcq-PbDtU",
    authDomain: "strix-shop.firebaseapp.com",
    projectId: "strix-shop"
});

const db = firebase.firestore();
let currentId = null;
let currentUserData = null;
let allUsersCache = []; // Cache snapshot docs for fast searching

firebase.auth().onAuthStateChanged(async u => {
    if (!u) {
        window.location.href = "index.html";
        return;
    }

    const me = await db.collection("users").doc(u.uid).get();

    if (!me.exists) {
        window.location.href = "home.html";
        return;
    }

    currentUserData = me.data();

    const canView = currentUserData.acc === "admin";
    const canModify = currentUserData.acc === "admin";

    if (!canView) {
        window.location.href = "home.html";
        return;
    }

    load();

    if (!canModify) {
        const saveBtn = document.querySelector(".save-btn");
        const deleteBtn = document.querySelector(".delete-btn");

        saveBtn.style.opacity = "0.5";
        deleteBtn.style.opacity = "0.5";

        saveBtn.style.cursor = "not-allowed";
        deleteBtn.style.cursor = "not-allowed";
    }
});

function getBadgeClass(acc) {
    const val = (acc || "customer").toLowerCase();
    if (val.includes("pro")) return "badge badge-pro";
    if (val.includes("premium")) return "badge badge-premium";
    if (val.includes("admin")) return "badge badge-admin";
    return "badge badge-customer";
}

function load(){
    db.collection("users").onSnapshot(async snap => {
        allUsersCache = snap.docs; // Cache documents
        document.getElementById("count").innerText = "TOTAL USERS: " + snap.size;
        renderTable(allUsersCache);
    });
}

async function renderTable(docs) {
    const body = document.getElementById("body");
    body.innerHTML = "";

    const searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();

    for (const doc of docs) {
        const u = doc.data();
        const userId = doc.id;
        
        const fullName = `${u.firstName || ""} ${u.lastName || ""}`.toLowerCase();
        const email = (u.email || "").toLowerCase();
        const username = (u.username || "").toLowerCase();
        const uid = userId.toLowerCase();

        // Filter condition check
        if (searchQuery && !fullName.includes(searchQuery) && !email.includes(searchQuery) && !username.includes(searchQuery) && !uid.includes(searchQuery)) {
            continue;
        }

        const statusBadge = `<span class="${getBadgeClass(u.acc)}">${u.acc || "customer"}</span>`;
        
        let signinoutStatus = "No Activity";
        let latestTimestamp = "";
        let badgeClass = "badge badge-customer"; 
        
        try {
            const entryDoc = await db.collection("entryexit").doc(userId).get();
            if (entryDoc.exists) {
                const data = entryDoc.data();
                const recordsMap = data.records || {};
                const keys = Object.keys(recordsMap).filter(k => !isNaN(k));
                
                if (keys.length > 0) {
                    keys.sort((a, b) => Number(b) - Number(a));
                    const latestRecord = recordsMap[keys[0]];
                    
                    signinoutStatus = latestRecord.eventAction || "Active";
                    latestTimestamp = (latestRecord.date || "") + " " + (latestRecord.time || "");
                    badgeClass = "badge badge-status"; 
                }
            }
        } catch (e) {
            console.error("Error fetching entryexit for", userId, e);
        }

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td><div class="pfp-mini" style="background-image:url('${u.pfp || ''}')"></div></td>
            <td style="font-weight:700;">${u.firstName || ""} ${u.lastName || ""}</td>
            <td style="color:var(--text-dim); font-size:11px;">${u.email || ""}</td>
            <td>${statusBadge}</td>
            <td><span class="${badgeClass}">${signinoutStatus}</span> <span style="font-size:10px; color:var(--text-dim); margin-left:4px;">${latestTimestamp}</span></td>
        `;
        tr.onclick = () => openSidebar(userId, u);
        body.appendChild(tr);
    }
}

function filterTable() {
    renderTable(allUsersCache);
}

async function openSidebar(id, u){
    currentId = id;
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("side-pfp").style.backgroundImage = `url('${u.pfp || ''}')`;
    document.getElementById("side-name").innerText = (u.firstName || "") + " " + (u.lastName || "");
    document.getElementById("side-uid").innerText = "ID: " + id.toUpperCase();
    
    const tagEl = document.getElementById("side-acc-tag");
    tagEl.className = getBadgeClass(u.acc);
    tagEl.innerText = (u.acc || "customer").toUpperCase();

    const container = document.getElementById("fields-container");
    container.innerHTML = "";

    const dataMap = {
        "First Name": u.firstName,
        "Last Name": u.lastName,
        "Email": u.email,
        "Username": u.username,
        "Classification": u.acc || "customer",
        "Grade": u.grade,
        "School": u.school,
        "Age": u.age,
        "DOB": u.dob,
        "Gender": u.gender,
        "Pronouns": u.pronouns,
        "SSC Balance": u.ssc,
        "Recovery Email": u.recoveryEmail,
        "Created At": u.createdAt,
        "Profile URL": u.pfp,
        "Sec Question": u.securityQuestion,
        "Sec Answer": u.securityAnswer
    };

    Object.keys(dataMap).forEach((k) => {
        const div = document.createElement("div");
        const isLong = k === "Email" || k === "Profile URL" || k === "Created At" || k === "Sec Question";
        div.className = isLong ? "field full-width" : "field";

        if (k === "Classification") {
            div.innerHTML = `
                <div class="label">${k.toUpperCase()}</div>
                <select class="value" style="width: 100%; background: transparent; border: none; outline: none; font-size: 13px; color: var(--text-main); font-weight: 600; cursor: pointer;">
                    <option value="customer" ${dataMap[k] === 'customer' ? 'selected' : ''}>Customer</option>
                    <option value="pro membership" ${dataMap[k] === 'pro membership' ? 'selected' : ''}>Pro Membership</option>
                    <option value="premium membership" ${dataMap[k] === 'premium membership' ? 'selected' : ''}>Premium Membership</option>
                    <option value="admin" ${dataMap[k] === 'admin' ? 'selected' : ''}>Admin</option>
                </select>
            `;
        } else {
            const isLocked = k === "First Name" || k === "Last Name" || k === "SSC Balance" || k === "Created At";
            const editableAttr = isLocked ? "" : 'contenteditable="true"';
            const valContent = dataMap[k] !== undefined && dataMap[k] !== null ? dataMap[k] : "";

            div.innerHTML = `
                <div class="label">${k.toUpperCase()}</div>
                <div class="value" ${editableAttr}>${valContent}</div>
            `;
        }
        container.appendChild(div);
    });

    const historyListEl = document.getElementById("side-history-list");
    historyListEl.innerHTML = `<div style="font-size: 12px; color: var(--text-dim);">Loading records...</div>`;

    try {
        const entryDoc = await db.collection("entryexit").doc(id).get();
        if (entryDoc.exists) {
            const data = entryDoc.data();
            const recordsMap = data.records || {};
            const keys = Object.keys(recordsMap).filter(k => !isNaN(k));

            if (keys.length > 0) {
                keys.sort((a, b) => Number(b) - Number(a));
                
                historyListEl.innerHTML = "";
                keys.forEach(key => {
                    const rec = recordsMap[key];
                    const item = document.createElement("div");
                    item.className = "history-item";
                    item.innerHTML = `
                        <div>
                            <span style="font-weight: 700; color: var(--primary);">${rec.eventAction || ''}</span>
                            <div style="font-size: 10px; color: var(--text-dim);">IP: ${rec.ipAddress || ''}</div>
                        </div>
                        <div style="text-align: right; font-family: 'Quicksand', monospace; font-size: 11px;">
                            <div>${rec.date || ''}</div>
                            <div style="color: var(--text-dim);">${rec.time || ''}</div>
                        </div>
                    `;
                    historyListEl.appendChild(item);
                });
            } else {
                historyListEl.innerHTML = `<div style="font-size: 12px; color: var(--text-dim);">No entry/exit logs found.</div>`;
            }
        } else {
            historyListEl.innerHTML = `<div style="font-size: 12px; color: var(--text-dim);">No entry/exit document found for user.</div>`;
        }
    } catch (err) {
        console.error("Error loading records list:", err);
        historyListEl.innerHTML = `<div style="font-size: 12px; color: var(--error);">Failed to load history.</div>`;
    }
}

function closeSidebar(){ 
    document.getElementById("sidebar").classList.remove("open"); 
}

async function save(){
    if (!currentUserData || currentUserData.acc !== "admin") {
        alert("ACCESS DENIED");
        return;
    }

    const fields = document.querySelectorAll(".field");
    const update = {};

    const keyMap = {
        "FIRST NAME":"firstName",
        "LAST NAME":"lastName",
        "CLASSIFICATION":"acc",
        "EMAIL":"email",
        "USERNAME":"username",
        "GRADE":"grade",
        "SCHOOL":"school",
        "AGE":"age",
        "GENDER":"gender",
        "PRONOUNS":"pronouns",
        "DOB":"dob",
        "SSC BALANCE":"ssc",
        "RECOVERY EMAIL":"recoveryEmail",
        "PROFILE URL":"pfp",
        "SEC QUESTION":"securityQuestion",
        "SEC ANSWER":"securityAnswer"
    };

    fields.forEach(f => {
        const label = f.querySelector(".label")?.innerText;
        const valElement = f.querySelector(".value");
        if (!valElement || !label) return;

        const val = valElement.tagName === "SELECT" ? valElement.value : valElement.innerText;

        if (keyMap[label]) {
            let finalVal = val;
            if (label === "SSC BALANCE") {
                finalVal = Number(finalVal) || 0;
            }
            update[keyMap[label]] = finalVal;
        }
    });

    try {
        await db.collection("users").doc(currentId).update(update);
        alert("RECORD UPDATED");
        closeSidebar();
    } catch (err) {
        console.error(err);
        alert("UPDATE FAILED");
    }
}

async function deleteAccount(){
    if (!currentUserData || currentUserData.acc !== "admin") {
        alert("ACCESS DENIED");
        return;
    }

    const confirmDelete = confirm("Permanently delete this record from files?");
    if (!confirmDelete) return;

    try {
        await db.collection("users").doc(currentId).delete();
        alert("RECORD DELETED");
        closeSidebar();
    } catch (err) {
        console.error(err);
        alert("DELETION FAILED");
    }
}
</script>
