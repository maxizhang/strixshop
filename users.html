<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strix Shop | Personnel Database</title>
    <link rel="icon" type="image/png" href="logospfd.png">
    <!-- Rounded Font: Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --surface: rgba(255, 255, 255, 0.18);
            --text-main: #0f172a;
            --text-dim: #475569;
            --border: rgba(255, 255, 255, 0.55);
            --border-subtle: rgba(226, 232, 240, 0.3);
            --nav-dark: #0a0c12;
            --error: #ef4444;
            --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.8), inset 0 -1px 2px rgba(0, 0, 0, 0.05);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Quicksand', sans-serif; 
        }

        body { 
            background: linear-gradient(-45deg, #e0e7ff, #f0fdf4, #e0f2fe, #f3e8ff);
            background-size: 400% 400%;
            animation: fluidBackground 20s ease infinite;
            color: var(--text-main); 
            min-height: 100vh; 
            overflow-x: hidden;
        }

        @keyframes fluidBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Bold, gray links globally */
        a {
            text-decoration: none;
            font-weight: 700;
            color: #64748b;
            transition: color 0.2s;
        }
        a:hover {
            color: #334155;
        }

        /* Taobao-inspired Professional Navbar */
        nav { 
            background: var(--nav-dark); 
            width: 100%; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .nav-main { 
            display: flex; 
            align-items: center; 
            padding: 14px 5%; 
            justify-content: space-between; 
            max-width: 1400px;
            margin: 0 auto;
        }
        .logo-box img { 
            height: 32px; 
            cursor: pointer; 
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); 
        }
        .nav-right-actions {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .nav-link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: color 0.2s;
        }
        .nav-link-item svg {
            stroke: #cbd5e1;
            transition: stroke 0.2s;
        }
        .nav-link-item:hover {
            color: #ffffff;
        }
        .nav-link-item:hover svg {
            stroke: #ffffff;
        }
        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
        }
        .nav-badge-text {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
            background: var(--surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1.5px solid var(--border);
            border-radius: 32px;
            padding: 35px;
            box-shadow: var(--glass-shadow);
        }

        .table-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e1b4b;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
        }
        th { 
            text-align: left; 
            font-size: 11px; 
            color: var(--primary); 
            padding: 12px 15px; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            border-bottom: 1.5px solid var(--border);
            font-weight: 700;
        }
        td { 
            padding: 14px 15px; 
            border-bottom: 1px solid rgba(226, 232, 240, 0.4); 
            font-size: 13px; 
            font-weight: 600;
            color: var(--text-main);
        }
        tr:hover td { 
            background: rgba(255, 255, 255, 0.3); 
            cursor: pointer; 
        }

        .pfp-mini { 
            width: 34px; 
            height: 34px; 
            border-radius: 50%; 
            background-size: cover; 
            background-position: center;
            border: 1.5px solid var(--border); 
        }

        .sidebar {
            position: fixed; 
            top: 0; 
            right: -550px;
            width: 550px; 
            height: 100vh;
            background: rgba(248, 250, 252, 0.94);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-left: 1.5px solid var(--border);
            z-index: 2000;
            display: flex; 
            flex-direction: column;
            box-shadow: -20px 0 40px rgba(0, 0, 0, 0.1);
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .sidebar.open { 
            transform: translateX(-550px); 
        }

        .dossier-top {
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 25px;
            border-bottom: 1.5px solid var(--border);
        }
        .pfp-large {
            width: 100px; height: 100px;
            border-radius: 50%;
            background-size: cover; background-position: center;
            border: 2px solid var(--primary);
            flex-shrink: 0;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.2);
        }
        .top-info { flex: 1; }
        .top-info h2 { font-size: 22px; font-weight: 700; margin-bottom: 5px; color: #1e1b4b; }
        .uid-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); }

        .sidebar-content { flex: 1; overflow-y: auto; padding: 25px 30px; }
        .close-trigger { 
            position: absolute; 
            right: 25px; 
            top: 20px; 
            font-size: 26px; 
            cursor: pointer; 
            color: var(--text-dim); 
            font-weight: 700;
            transition: color 0.2s; 
        }
        .close-trigger:hover { color: var(--text-main); }

        .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .field { 
            background: rgba(255, 255, 255, 0.6); 
            padding: 12px 16px; 
            border-radius: 16px; 
            border: 1.5px solid var(--border);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .full-width { grid-column: span 2; }
        .label { font-size: 10px; color: var(--primary); font-weight: 700; margin-bottom: 4px; letter-spacing: 1px; }
        .value { outline: none; font-size: 13px; color: var(--text-main); font-weight: 600; display: block; word-break: break-all; }
        .value[contenteditable="true"]:hover {
            background: rgba(79, 70, 229, 0.04);
            border-radius: 4px;
            padding: 2px 4px;
            margin: -2px -4px;
        }

        .sidebar-footer { 
            padding: 20px 30px; 
            border-top: 1.5px solid var(--border);
            display: flex; 
            gap: 12px;
            background: rgba(255, 255, 255, 0.4);
        }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 14px;
            font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.2s;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .save-btn { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .save-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .delete-btn { background: transparent; border: 1.5px solid var(--error); color: var(--error); }
        .delete-btn:hover { background: rgba(239, 68, 68, 0.08); transform: translateY(-1px); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; right: -100%; }
            .sidebar.open { transform: translateX(-100%); }
            .field-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

<!-- Taobao-Inspired Professional Navbar -->
<nav>
    <div class="nav-main">
        <div class="logo-box" onclick="window.location.href='home.html'"><img src="logoh.png" alt="STRIX"></div>
        <div class="nav-right-actions">
            <a href="home.html" class="nav-link-item">
                <svg width="15" height="15" fill="none" stroke-width="2.2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Home
            </a>
            <a href="cs.html" class="nav-link-item">
                <svg width="15" height="15" fill="none" stroke-width="2.2" viewBox="0 0 24 24"><path d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636l3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                Customer Service
            </a>
            <div class="nav-divider"></div>
            <span class="nav-badge-text">Personnel Database</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="table-header-bar">
        <div class="table-title">Personnel Records</div>
        <div id="count" style="font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--primary); font-weight:700;">TOTAL USERS: 0</div>
    </div>
    <table>
        <thead>
            <tr>
                <th></th>
                <th>Operative</th>
                <th>Secure Email</th>
                <th>Class</th>
                <th>SSC</th>
            </tr>
        </thead>
        <tbody id="body"></tbody>
    </table>
</div>

<div class="sidebar" id="sidebar">
    <div class="close-trigger" onclick="closeSidebar()">×</div>
    
    <div class="dossier-top">
        <div class="pfp-large" id="side-pfp"></div>
        <div class="top-info">
            <h2 id="side-name">Name</h2>
            <div class="uid-tag" id="side-uid">UID: ---</div>
            <div id="side-acc-tag" style="margin-top:8px; font-size:10px; font-weight:800; color:var(--primary); letter-spacing:1px;">CUSTOMER</div>
        </div>
    </div>

    <div class="sidebar-content">
        <div class="field-grid" id="fields-container"></div>
    </div>

    <div class="sidebar-footer">
        <button class="btn delete-btn" onclick="deleteAccount()">Delete User</button>
        <button class="btn save-btn" onclick="save()">Update</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
firebase.initializeApp({
    apiKey: "AIzaSyDKed-yuAcwqKqcL6fn2WnBhRPcq-PbDtU",
    authDomain: "strix-shop.firebaseapp.com",
    projectId: "strix-shop"
});

const db = firebase.firestore();
let currentId = null;
let currentUserData = null;

firebase.auth().onAuthStateChanged(async u => {
    if (!u) {
        window.location.href = "index.html";
        return;
    }

    const me = await db.collection("users").doc(u.uid).get();

    if (!me.exists) {
        window.location.href = "home.html";
        return;
    }

    currentUserData = me.data();

    const canView = currentUserData.acc === "admin";
    const canModify = currentUserData.acc === "admin";

    if (!canView) {
        window.location.href = "home.html";
        return;
    }

    load();

    if (!canModify) {
        const saveBtn = document.querySelector(".save-btn");
        const deleteBtn = document.querySelector(".delete-btn");

        saveBtn.style.opacity = "0.5";
        deleteBtn.style.opacity = "0.5";

        saveBtn.style.cursor = "not-allowed";
        deleteBtn.style.cursor = "not-allowed";
    }
});

function load(){
    db.collection("users").onSnapshot(snap => {
        document.getElementById("count").innerText = "TOTAL USERS: " + snap.size;
        const body = document.getElementById("body");
        body.innerHTML = "";

        snap.forEach(doc => {
            const u = doc.data();
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><div class="pfp-mini" style="background-image:url('${u.pfp || 'https://via.placeholder.com/100'}')"></div></td>
                <td style="font-weight:700;">${u.firstName || ""} ${u.lastName || ""}</td>
                <td style="color:var(--text-dim); font-size:11px;">${u.email || "---"}</td>
                <td style="color:var(--primary); font-weight:700; text-transform:uppercase; font-size:10px;">${u.acc || "customer"}</td>
                <td>${u.ssc || 0}</td>
            `;
            tr.onclick = () => openSidebar(doc.id, u);
            body.appendChild(tr);
        });
    });
}

function openSidebar(id, u){
    currentId = id;
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("side-pfp").style.backgroundImage = `url('${u.pfp || 'https://via.placeholder.com/200'}')`;
    document.getElementById("side-name").innerText = (u.firstName || "") + " " + (u.lastName || "");
    document.getElementById("side-uid").innerText = "ID: " + id.toUpperCase();
    document.getElementById("side-acc-tag").innerText = (u.acc || "customer").toUpperCase();

    const container = document.getElementById("fields-container");
    container.innerHTML = "";

    const dataMap = {
        "First Name": u.firstName,
        "Last Name": u.lastName,
        "Email": u.email,
        "Username": u.username,
        "Classification": u.acc,
        "Grade": u.grade,
        "School": u.school,
        "Age": u.age,
        "DOB": u.dob,
        "Gender": u.gender,
        "Pronouns": u.pronouns,
        "SSC Balance": u.ssc,
        "Recovery Email": u.recoveryEmail,
        "Created At": u.createdAt,
        "Profile URL": u.pfp,
        "Sec Question": u.securityQuestion,
        "Sec Answer": u.securityAnswer
    };

    Object.keys(dataMap).forEach((k) => {
        const div = document.createElement("div");
        
        const isLong = k === "Email" || k === "Profile URL" || k === "Created At" || k === "Sec Question";
        div.className = isLong ? "field full-width" : "field";

        const isLocked = k === "SSC Balance" || k === "Created At";
        const editableAttr = isLocked ? "" : 'contenteditable="true"';

        div.innerHTML = `
            <div class="label">${k.toUpperCase()}</div>
            <div class="value" ${editableAttr}>${dataMap[k] !== undefined ? dataMap[k] : "---"}</div>
        `;
        container.appendChild(div);
    });
}

function closeSidebar(){ 
    document.getElementById("sidebar").classList.remove("open"); 
}

async function save(){
    if (!currentUserData || currentUserData.acc !== "admin") {
        alert("ACCESS DENIED");
        return;
    }

    const fields = document.querySelectorAll(".field");
    const update = {};

    const keyMap = {
        "FIRST NAME":"firstName",
        "LAST NAME":"lastName",
        "CLASSIFICATION":"acc",
        "EMAIL":"email",
        "USERNAME":"username",
        "GRADE":"grade",
        "SCHOOL":"school",
        "AGE":"age",
        "GENDER":"gender",
        "PRONOUNS":"pronouns",
        "DOB":"dob",
        "SSC BALANCE":"ssc",
        "RECOVERY EMAIL":"recoveryEmail",
        "PROFILE URL":"pfp",
        "SEC QUESTION":"securityQuestion",
        "SEC ANSWER":"securityAnswer"
    };

    fields.forEach(f => {
        const label = f.querySelector(".label").innerText;
        const val = f.querySelector(".value").innerText;

        if (keyMap[label]) {
            let finalVal = val === "---" ? "" : val;

            if (label === "SSC BALANCE") {
                finalVal = Number(finalVal) || 0;
            }

            update[keyMap[label]] = finalVal;
        }
    });

    try {
        await db.collection("users").doc(currentId).update(update);
        alert("RECORD UPDATED");
    } catch (err) {
        console.error(err);
        alert("UPDATE FAILED");
    }
}

async function deleteAccount(){
    if (!currentUserData || currentUserData.acc !== "admin") {
        alert("ACCESS DENIED");
        return;
    }

    const confirmDelete = confirm("Permanently delete this record from files?");
    if (!confirmDelete) return;

    try {
        await db.collection("users").doc(currentId).delete();
        alert("RECORD DELETED");
        closeSidebar();
    } catch (err) {
        console.error(err);
        alert("DELETION FAILED");
    }
}
</script>
</body>
</html>
