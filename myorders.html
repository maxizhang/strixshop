<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders - Strix Shop</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #555383;
    --primary-hover: #5b5978;
    --surface: rgba(255, 255, 255, 0.28);
    --surface-hover: rgba(255, 255, 255, 0.38);
    --text-main: #0f172a;
    --text-dim: #475569;
    --border: rgba(255, 255, 255, 0.6);
    --blue: #3b82f6;
    --purple: #8b5cf6;
    --ink: #172033;
    --muted: #6b7280;
    --line: rgba(148,163,184,.22);
    --green: #16a34a;
    --orange: #d97706;
    --red: #dc2626;
    --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.8), inset 0 -1px 2px rgba(0, 0, 0, 0.05);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Quicksand', sans-serif;
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    line-height: 1.6;
    position: relative;
}

/* Background Layer with Random Image Support */
.bg-layer {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0.65;
    z-index: -2;
    transition: all 1s ease-in-out;
}

.bg-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, rgba(240, 244, 248, 0.75), rgba(224, 231, 255, 0.75));
    z-index: -1;
}

/* Professional Navbar matching About page */
nav {
    background: rgba(0, 0, 0, 0.75);
    height: 60px;
    width: 100%;
    position: sticky;
    top: 0;
    z-index: 1000;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
}

.nav-main {
    display: flex;
    align-items: center;
    padding: 0 5%;
    justify-content: space-between;
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
}

.logo-box img {
    height: 28px;
    cursor: pointer;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.logo-box img:hover {
    transform: scale(1.04);
}

.nav-right-actions {
    display: flex;
    align-items: center;
    gap: 20px;
}

.nav-link-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #cbd5e1;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    transition: color 0.2s;
}

.nav-link-item svg {
    stroke: #cbd5e1;
    transition: stroke 0.2s;
    flex-shrink: 0;
}

.nav-link-item:hover {
    color: #ffffff;
}

.nav-link-item:hover svg {
    stroke: #ffffff;
}

.nav-divider {
    width: 1px;
    height: 20px;
    background: rgba(255, 255, 255, 0.15);
}

.nav-badge-text {
    font-size: 12px;
    font-weight: 600;
    color: #94a3b8;
    letter-spacing: 0.5px;
}

button, a, input, select, textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

a {
    color: inherit;
}

.page {
    width: min(1120px, calc(100% - 32px));
    margin: 0 auto;
    padding: 30px 0 50px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 30px;
    position: relative;
    z-index: 10;
}

.icon {
    width: 16px;
    height: 16px;
    display: inline-block;
    flex: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}

.icon-lg {
    width: 22px;
    height: 22px;
}

.hero {
    position: relative;
    overflow: hidden;
    border-radius: 32px;
    padding: 40px;
    background: var(--surface);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    color: var(--text-main);
    box-shadow: var(--glass-shadow);
    border: 1.5px solid var(--border);
}

.hero h1 {
    font-size: 28px;
    letter-spacing: -.6px;
    margin-bottom: 6px;
    color: #1e1b4b;
}

.hero p {
    font-size: 14px;
    color: var(--text-dim);
    font-weight: 600;
}

.user-id-badge {
    display: inline-block;
    margin-top: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: rgba(255, 255, 255, 0.4);
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.7);
    color: #1e1b4b;
    font-weight: 700;
}

.toolbar {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--glass-shadow);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

.tabs {
    display: flex;
    overflow: auto;
    flex: 1;
    gap: 6px;
    scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
    display: none;
}

.tab {
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 10px;
    white-space: nowrap;
    font-size: 12px;
    font-weight: 700;
    transition: .2s;
}

.tab:hover {
    background: rgba(255, 255, 255, 0.4);
    color: #1e1b4b;
}

.tab.active {
    background: var(--primary);
    color: #ffffff;
    border-color: var(--primary);
    box-shadow: 0 4px 12px rgba(85, 83, 131, 0.2);
}

.search {
    width: 240px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(255, 255, 255, 0.7);
    background: rgba(255, 255, 255, 0.4);
    border-radius: 12px;
    padding: 8px 12px;
    color: var(--text-dim);
}

.search:focus-within {
    border-color: var(--primary);
    background: rgba(255, 255, 255, 0.7);
}

.search input {
    width: 100%;
    border: 0;
    outline: 0;
    font-size: 12px;
    color: var(--text-main);
    background: transparent;
    font-weight: 600;
}

.order-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 28px;
    margin-bottom: 20px;
    box-shadow: var(--glass-shadow);
    overflow: hidden;
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    transition: transform 0.3s ease, background 0.3s ease;
}

.order-card:hover {
    background: var(--surface-hover);
    transform: translateY(-2px);
}

.order-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 20px 24px;
    background: rgba(255, 255, 255, 0.2);
    border-bottom: 1px solid rgba(255, 255, 255, 0.3);
}

.order-info {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.order-id {
    font-size: 14px;
    font-weight: 800;
    color: #1e1b4b;
}

.order-date {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 600;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
}

.status:before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
}

.status.placed, .status.ordered { color: #2563eb; background: rgba(59,130,246,.12); border: 1px solid rgba(59,130,246,.25); }
.status.shipping, .status.delivering { color: #b45309; background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.25); }
.status.arrived { color: #7c3aed; background: rgba(139,92,246,.12); border: 1px solid rgba(139,92,246,.25); }
.status.delivered { color: #15803d; background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.25); }
.status.cancelled { color: #dc2626; background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.25); }

.items {
    padding: 10px 24px;
}

.item {
    display: grid;
    grid-template-columns: minmax(0,1fr) auto;
    gap: 16px;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.3);
}

.item:last-child {
    border-bottom: 0;
}

.item-main {
    min-width: 0;
}

.item-name {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
    color: #1e1b4b;
}

.item-meta {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
    font-weight: 600;
}

.item-price {
    text-align: right;
    min-width: 95px;
}

.now {
    font-size: 15px;
    font-weight: 800;
    color: #1e1b4b;
}

.was {
    display: block;
    color: #94a3b8;
    text-decoration: line-through;
    font-size: 11px;
    margin-top: 2px;
}

.save {
    display: inline-block;
    margin-top: 4px;
    background: rgba(34,197,94,.12);
    color: #15803d;
    border: 1px solid rgba(34,197,94,.2);
    border-radius: 6px;
    padding: 2px 6px;
    font-size: 9px;
    font-weight: 800;
}

.order-summary {
    padding: 16px 24px;
    border-top: 1px dashed rgba(255, 255, 255, 0.5);
    display: flex;
    justify-content: flex-end;
}

.summary-box {
    width: min(300px, 100%);
    font-size: 13px;
}

.sum-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    color: var(--text-dim);
    font-weight: 600;
}

.sum-row.discount {
    color: var(--green);
    font-weight: 700;
}

.sum-row.total {
    border-top: 1px solid rgba(255, 255, 255, 0.4);
    margin-top: 6px;
    padding-top: 10px;
    color: #1e1b4b;
    font-weight: 800;
    font-size: 16px;
}

.order-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 16px 24px;
    background: rgba(255, 255, 255, 0.2);
    border-top: 1px solid rgba(255, 255, 255, 0.3);
    flex-wrap: wrap;
}

.help-text {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 600;
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1px solid rgba(255, 255, 255, 0.7);
    background: rgba(255, 255, 255, 0.4);
    color: #1e1b4b;
    border-radius: 12px;
    padding: 8px 14px;
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
    transition: .18s;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
}

.action:hover {
    border-color: var(--primary);
    background: var(--primary);
    color: #ffffff;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(85, 83, 131, 0.25);
}

.action:hover svg {
    stroke: #ffffff;
}

footer {
    text-align: center;
    padding: 30px;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.15);
    position: relative;
    z-index: 10;
}

.state {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 28px;
    box-shadow: var(--glass-shadow);
    padding: 60px 20px;
    text-align: center;
    color: var(--text-dim);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
}

.state-icon {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    margin: 0 auto 16px;
    display: grid;
    place-items: center;
    background: rgba(85, 83, 131, 0.1);
    color: var(--primary);
    border: 1px solid rgba(85, 83, 131, 0.2);
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.2s;
}

.state-icon:hover {
    transform: scale(1.05);
}

.state h3 {
    font-size: 18px;
    color: #1e1b4b;
    margin-bottom: 6px;
    font-weight: 800;
}

.state p {
    font-size: 13px;
    font-weight: 600;
}

.spinner {
    width: 24px;
    height: 24px;
    border: 3px solid rgba(85, 83, 131, 0.2);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto 16px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.toast {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 50;
    background: rgba(255, 255, 255, 0.9);
    color: var(--text-main);
    border: 1.5px solid var(--border);
    padding: 12px 18px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 14px 35px rgba(0,0,0,0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    opacity: 0;
    transform: translateY(12px);
    pointer-events: none;
    transition: .25s;
}

.toast.show {
    opacity: 1;
    transform: none;
}
</style>
</head>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDKed-yuAcwqKqcL6fn2WnBhRPcq-PbDtU",
    authDomain: "strix-shop.firebaseapp.com",
    projectId: "strix-shop"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const db = firebase.firestore();
const auth = firebase.auth();

let allOrders = [];
let activeFilter = "all";
let searchTerm = "";

auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById("uid-display").textContent = "User ID: " + user.uid;
        loadCustomerOrders(user.uid);
    } else {
        window.location.href = "signin.html";
    }
});

function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function money(value) {
    return "$" + (parseFloat(value) || 0).toFixed(2);
}

function getTimestamp(order) {
    if (!order.createdAt) return 0;
    if (typeof order.createdAt.toMillis === 'function') {
        return order.createdAt.toMillis();
    }
    if (order.createdAt.seconds) {
        return order.createdAt.seconds * 1000;
    }
    if (order.createdAt instanceof Date) {
        return order.createdAt.getTime();
    }
    if (typeof order.createdAt === 'string') {
        return new Date(order.createdAt).getTime() || 0;
    }
    return 0;
}

function normalizeStatus(status) {
    const raw = String(status || "Placed").trim().toLowerCase().replace(/[\s\_-]+/g, " ");
    const aliases = {
        "place": "placed", "placed": "placed",
        "order": "ordered", "ordered": "ordered", "processing": "ordered",
        "ship": "shipping", "shipping": "shipping", "shipped": "shipping",
        "arrive": "arrived", "arrived": "arrived",
        "out for delivery": "delivering", "delivering": "delivering", "out-of-delivery": "delivering",
        "deliver": "delivered", "delivered": "delivered", "completed": "delivered",
        "cancel": "cancelled", "cancelled": "cancelled", "canceled": "cancelled", "refunded": "cancelled", "returned": "cancelled"
    };
    return aliases[raw] || "placed";
}

function displayStatus(status) {
    const s = normalizeStatus(status);
    return s.charAt(0).toUpperCase() + s.slice(1);
}

function statusClass(status) {
    return normalizeStatus(status);
}

function matchesFilter(order) {
    if (activeFilter === "all") return true;
    return normalizeStatus(order.status) === activeFilter;
}

function matchesSearch(order) {
    if (!searchTerm) return true;
    const haystack = [
        order.id,
        order.orderDate,
        order.status,
        order.customer,
        ...(order.items || []).map(item => item.name || ""),
        ...(order.items || []).map(item => item.variantText || "")
    ].join(" ").toLowerCase();
    return haystack.includes(searchTerm);
}

function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => { toast.classList.remove("show"); }, 2600);
}

function searchProductByName(productName) {
    if (!productName) {
        window.location.href = "products.html";
        return;
    }
    window.location.href = `products.html?search=${encodeURIComponent(productName)}`;
}

function inquireOrder(orderId) {
    if (!orderId) {
        window.location.href = "cs.html";
        return;
    }
    window.location.href = `cs.html?orderId=${encodeURIComponent(orderId)}`;
}

async function reorderOrder(orderId, button) {
    const user = auth.currentUser;
    if (!user) {
        showToast("Please log in first.");
        return;
    }

    const old = button.innerHTML;
    button.disabled = true;
    button.textContent = "Adding...";

    try {
        const doc = await db.collection("orders").doc(orderId).get();
        if (!doc.exists) throw new Error("Order not found.");

        const items = doc.data().items || [];
        if (!items.length) throw new Error("Order has no items.");

        const batch = db.batch();
        items.forEach(item => {
            const productId = item.productId || item.id;
            if (!productId) return;
            const ref = db.collection("carts").doc(user.uid).collection("items").doc(productId);
            batch.set(ref, {
                productId,
                name: item.name || "Product",
                price: parseFloat(item.price) || 0,
                variantText: item.variantText || "",
                selections: item.selections || {},
                qty: firebase.firestore.FieldValue.increment(parseInt(item.qty) || 1),
                addedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
        });

        await batch.commit();
        button.textContent = "Added";
        showToast(`${items.length} item(s) added to cart`);
        setTimeout(() => {
            button.innerHTML = old;
            button.disabled = false;
        }, 1800);
    } catch(error) {
        console.error(error);
        button.innerHTML = old;
        button.disabled = false;
        showToast("Failed to reorder: " + error.message);
    }
}

function loadCustomerOrders(uid) {
    db.collection("orders")
        .where("uid", "==", uid)
        .onSnapshot(
            snap => {
                allOrders = snap.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .sort((a, b) => getTimestamp(b) - getTimestamp(a));

                if (!allOrders.length) {
                    document.getElementById("orders-container").innerHTML = `
                        <div class="state">
                            <a href="products.html" class="state-icon" title="Go to Products">
                                <svg class="icon-lg" viewBox="0 0 24 24"><path d="M3 7h18"></path><path d="M5 7l1.5 13h11L19 7"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>
                            </a>
                            <h3>No orders yet</h3>
                            <p>Your purchases linked to this User ID will appear here after you place an order.</p>
                        </div>
                    `;
                    return;
                }
                renderOrders();
            },
            error => {
                console.error(error);
                document.getElementById("orders-container").innerHTML = `
                    <div class="state">
                        <div class="state-icon">
                            <svg class="icon-lg" viewBox="0 0 24 24"><path d="M12 8v5"></path><path d="M12 16h.01"></path><path d="M10.3 3.5 2.8 17a2 2 0 0 0 1.75 3h14.9a2 2 0 0 0 1.75-3l-7.5-13.5a2 2 0 0 0-3.4 0Z"></path></svg>
                        </div>
                        <h3>Couldn't load orders</h3>
                        <p>${escapeHtml(error.message)}</p>
                    </div>
                `;
            }
        );
}

function renderOrders() {
    const container = document.getElementById("orders-container");
    const filtered = allOrders.filter(order => matchesFilter(order) && matchesSearch(order));

    if (!filtered.length) {
        container.innerHTML = `
            <div class="state">
                <h3>No matching orders</h3>
                <p>Try another status or search term.</p>
            </div>
        `;
        return;
    }

    container.innerHTML = filtered.map(order => renderOrder(order)).join("");
}

function renderOrder(order) {
    const items = order.items || [];
    const subtotal = items.reduce((sum, item) => sum + ((parseFloat(item.price) || 0) * (parseInt(item.qty) || 1)), 0);
    const discounts = Array.isArray(order.discounts) ? order.discounts : [];
    const discountTotal = discounts.reduce((sum, d) => sum + (parseFloat(d.amount) || 0), 0);
    const calculatedTotal = Math.max(0, subtotal - discountTotal);
    const finalTotal = order.total !== undefined && order.total !== null ? parseFloat(order.total) || 0 : calculatedTotal;
    const status = displayStatus(order.status);
    const cls = statusClass(order.status);

    const itemRows = items.map(item => {
        const price = parseFloat(item.price) || 0;
        const qty = parseInt(item.qty) || 1;
        const original = parseFloat(item.originalPrice) || (item.discount ? price / (1 - (parseFloat(item.discount) || 0) / 100) : 0);
        const hasDiscount = original > price;
        const selections = item.selections && Object.keys(item.selections).length ? Object.values(item.selections).join(" / ") : "";

        return `
            <div class="item">
                <div class="item-main">
                    <div class="item-name">${escapeHtml(item.name || "Product Item")}</div>
                    <div class="item-meta">
                        ${item.variantText ? escapeHtml(item.variantText) + " · " : ""}
                        Qty ${qty}
                        ${selections ? " · " + escapeHtml(selections) : ""}
                    </div>
                    <button type="button" class="action" style="margin-top:7px;padding:6px 10px" onclick="searchProductByName('${escapeHtml(item.name || "").replace(/'/g, "\\'")}')">
                        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
                        Find Product
                    </button>
                </div>
                <div class="item-price">
                    <span class="now">${money(price * qty)}</span>
                    ${hasDiscount ? `
                        <span class="was">${money(original * qty)}</span>
                        <span class="save">SAVE ${money((original - price) * qty)}</span>
                    ` : ""}
                </div>
            </div>
        `;
    }).join("");

    const discountRows = discounts.map(d => `
        <div class="sum-row discount">
            <span>${escapeHtml(d.name || "Discount")}</span>
            <span>−${money(d.amount)}</span>
        </div>
    `).join("");

    return `
        <article class="order-card">
            <div class="order-head">
                <div class="order-info">
                    <span class="order-id">Order #${escapeHtml(order.id)}</span>
                    <span class="order-date">${escapeHtml(order.orderDate || "Recently")}</span>
                </div>
                <span class="status ${cls}">${escapeHtml(status)}</span>
            </div>

            <div class="items">
                ${itemRows || '<div style="padding:20px 0;color:var(--text-dim);font-size:12px;font-weight:600">No items recorded.</div>'}
            </div>

            <div class="order-summary">
                <div class="summary-box">
                    ${discounts.length ? `
                        <div class="sum-row">
                            <span>Subtotal</span>
                            <span>${money(subtotal)}</span>
                        </div>
                        ${discountRows}
                    ` : ""}
                    <div class="sum-row total">
                        <span>Total</span>
                        <span>${money(finalTotal)}</span>
                    </div>
                </div>
            </div>

            <div class="order-foot">
                <span class="help-text">
                    ${items.length} item${items.length === 1 ? "" : "s"} · Need help with this order?
                </span>
                <div class="actions">
                    <button type="button" class="action" onclick="inquireOrder('${escapeHtml(order.id)}')">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.8 8.8 0 0 1-3.3-.7L4 20l1.7-4.1A7.3 7.3 0 0 1 4.5 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5Z"></path><path d="M8 11h.01"></path><path d="M12 11h.01"></path><path d="M16 11h.01"></path></svg>
                        Send to Customer Support
                    </button>
                    <a class="action" href="r-r.html">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v6h6"></path><path d="M12 7v5l3 2"></path></svg>
                        Returns & Refunds
                    </a>
                    <a class="action" href="review.html">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        Rate and Review
                    </a>
                </div>
            </div>
        </article>
    `;
}

document.getElementById("tabs").addEventListener("click", e => {
    const tab = e.target.closest(".tab");
    if (!tab) return;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeFilter = tab.dataset.filter;
    renderOrders();
});

document.getElementById("search").addEventListener("input", e => {
    searchTerm = e.target.value.trim().toLowerCase();
    renderOrders();
});
</script>
