<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strix Shop | Calming Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }

        .bg {
            position: absolute; inset: 0; background-size: cover; background-position: center;
            transition: opacity 1.5s ease-in-out, transform 10s ease;
            transform: scale(1); opacity: 0; z-index: 1;
        }
        .bg.active { opacity: 1; transform: scale(1.08); }

        .rainbow-bg {
            position: absolute; inset: 0;
            background: linear-gradient(-45deg, #f09e9e, #efdd94, #8fe7af, #93bcef, #cda4f6);
            background-size: 400% 400%;
            animation: fluid 20s ease infinite;
            opacity: 0; transition: opacity 1.5s ease; z-index: 1;
        }
        .rainbow-bg.active { opacity: 1; }
        @keyframes fluid { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        sidebar {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5); padding: 15px; border-radius: 18px;
            display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        sidebar button {
            background: rgba(255, 255, 255, 0.5); border: 1px solid rgba(255, 255, 255, 0.7);
            padding: 10px 16px; border-radius: 12px; font-weight: 700; color: #1e293b;
            cursor: pointer; transition: 0.2s; text-align: left;
        }
        sidebar button:hover, sidebar button.active { background: #fff; color: #0f172a; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="rainbow-bg" id="rainbow"></div>
    <div class="bg" id="img1"></div>
    <div class="bg" id="img2"></div>

    <sidebar>
        <button onclick="setMode('rainbow')" id="btn-rainbow">Rainbow</button>
        <button onclick="setMode('images')" id="btn-images">Images</button>
    </sidebar>

    <script>
        const rainbow = document.getElementById('rainbow');
        const imgEls = [document.getElementById('img1'), document.getElementById('img2')];
        let mode = 'rainbow', timer = null, activeImg = 0;

        function setMode(newMode) {
            mode = newMode;
            clearInterval(timer);
            document.querySelectorAll('sidebar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + mode).classList.add('active');

            if (mode === 'rainbow') {
                rainbow.classList.add('active');
                imgEls.forEach(el => el.classList.remove('active'));
            } else {
                rainbow.classList.remove('active');
                changeImage();
                timer = setInterval(changeImage, 5000);
            }
        }

        function changeImage() {
            if (mode !== 'images') return;
            const n = Math.floor(Math.random() * 12) + 1;
            const nextIdx = 1 - activeImg;
            imgEls[nextIdx].style.backgroundImage = `url('bg${n}.png')`;
            imgEls[nextIdx].classList.add('active');
            imgEls[activeImg].classList.remove('active');
            activeImg = nextIdx;
        }

        setMode('rainbow');
    </script>
</body>
</html>
