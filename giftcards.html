<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="spfd.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strix Shop | Gift Cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #484976;
            --primary-hover: #4f4c74;
            --surface: rgba(255, 255, 255, 0.28);
            --surface-hover: rgba(255, 255, 255, 0.38);
            --text-main: #0f172a;
            --text-dim: #475569;
            --border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.8), inset 0 -1px 2px rgba(0, 0, 0, 0.05);
            --radius-main: 32px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Quicksand', sans-serif; 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.6;
            position: relative;
        }

        /* Background Layer with Random Image Support */
        .bg-layer {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.65;
            z-index: -2;
            transition: all 1s ease-in-out;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(240, 244, 248, 0.75), rgba(224, 231, 255, 0.75));
            z-index: -1;
        }

        /* Entrance Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        /* Navigation Bar */
        nav {
            background: rgba(0, 0, 0, 0.75);
            height: 60px;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
        }

        .nav-main {
            display: flex;
            align-items: center;
            padding: 0 5%;
            justify-content: space-between;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-box img {
            height: 28px;
            cursor: pointer;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-box img:hover {
            transform: scale(1.04);
        }

        .nav-right-actions {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: color 0.25s ease;
        }

        .nav-link-item svg {
            stroke: #cbd5e1;
            transition: stroke 0.25s ease;
        }

        .nav-link-item:hover {
            color: #ffffff;
        }

        .nav-link-item:hover svg {
            stroke: #ffffff;
        }

        .cart-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: background 0.2s;
        }

        .cart-pill:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .cart-pill svg {
            fill: #cbd5e1;
        }

        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-badge-text {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
            flex: 1;
        }

        .hero {
            text-align: center;
            margin-bottom: 40px;
            padding: 0 20px;
        }

        h1 { 
            font-size: 32px; 
            font-weight: 700; 
            margin: 0 0 10px; 
            color: #1e1b4b; 
            letter-spacing: -0.5px; 
        }

        .hero p {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dim);
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Gift Cards Grid - Strictly 3 Boxes Per Row */
        .gc-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .glass-card {
            background: var(--surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-main);
            overflow: hidden;
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.35s cubic-bezier(0.4, 0, 0.2, 1), background 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: var(--surface-hover);
            transform: translateY(-4px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12), inset 0 1px 3px rgba(255, 255, 255, 0.9);
        }

        .gift-image-wrap {
            position: relative;
            width: 100%;
            height: 180px;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .gift-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gift-content {
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
            gap: 20px;
        }

        .gift-top {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-tag {
            font-family: 'Quicksand', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 700;
        }

        .glass-card h2 { 
            font-size: 18px; 
            font-weight: 700; 
            margin: 0; 
            color: #1e1b4b; 
        }

        .glass-card p { 
            color: var(--text-dim); 
            line-height: 1.6; 
            font-size: 13px; 
            margin: 0; 
            font-weight: 600;
        }

        .gift-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .gift-price {
            font-size: 20px;
            font-weight: 700;
            color: #1e1b4b;
        }

        .gift-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 10px 18px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .gift-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .gift-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--surface);
            backdrop-filter: blur(40px);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-main);
        }

        .empty-state h2 {
            color: #1e1b4b;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 600;
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #0f172a;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
            z-index: 2000;
            border: 1px solid rgba(255,255,255,0.1);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 10;
        }

        @media (max-width: 900px) {
            .gc-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .gc-grid { grid-template-columns: 1fr; }
            .container { width: 95%; margin: 25px auto; }
            .glass-card { border-radius: 24px; }
            .hero h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

<div class="bg-layer" id="bgLayer"></div>
<div class="bg-overlay"></div>

<nav>
    <div class="nav-main">
        <div class="logo-box" onclick="window.location.href='giftcards.html'">
            <img src="logoh.png" alt="STRIX">
        </div>
        <div class="nav-right-actions">
            <a href="index.html" class="nav-link-item">
                <svg width="15" height="15" fill="none" stroke-width="2.2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Home
            </a>
            <a href="cart.html" class="cart-pill">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM7.17 14h9.95c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0 0 21.58 5H5.21l-.94-2H1v2h2l3.6 7.59-1.35 2.44A2 2 0 0 0 5 16c0 1.1.9 2 2 2h12v-2H7l1.17-2z"/>
                </svg>
                <span id="cart-count">0</span>
            </a>
            <div class="nav-divider"></div>
            <span class="nav-badge-text">Gift Cards</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="hero animate-in delay-1">
        <h1>Strix Shop Gift Cards</h1>
        <p>Purchase gift cards for friends, classmates, or future purchases. They will be delivered as quickly as possible.</p>
    </div>

    <div class="gc-grid animate-in delay-2" id="gc-container">
        <!-- Dynamic gift cards will load here -->
    </div>
</div>

<div id="toast">
    Added to Cart
</div>

<footer>
    &copy; 2026 STRIX SHOP. ALL RIGHTS RESERVED.
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
    // Random Background Image Loader
    const n = Math.floor(Math.random() * 12) + 1;
    const bgLayer = document.getElementById("bgLayer");
    const img = new Image();
    img.src = `bg${n}.png`;
    img.onload = () => bgLayer.style.backgroundImage = `url('${img.src}')`;

    const firebaseConfig = {
        apiKey: "AIzaSyDKed-yuAcwqKqcL6fn2WnBhRPcq-PbDtU",
        authDomain: "strix-shop.firebaseapp.com",
        projectId: "strix-shop"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();
    const auth = firebase.auth();

    auth.onAuthStateChanged((user) => {
        if (user) {
            updateCartCounter();
            loadGiftCards();
        } else {
            window.location.href = "signin.html";
        }
    });

    function updateCartCounter() {
        db.collection("carts")
        .doc(auth.currentUser.uid)
        .collection("items")
        .onSnapshot(snap => {
            document.getElementById("cart-count").innerText = snap.size;
        });
    }

    function loadGiftCards() {
        const container = document.getElementById("gc-container");

        db.collection("products")
        .where("category", "==", "GIFT CARDS")
        .onSnapshot(snap => {
            container.innerHTML = "";

            if (snap.empty) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>No Gift Cards Available</h2>
                        <p>Please check back later.</p>
                    </div>
                `;
                return;
            }

            snap.forEach(doc => {
                const p = doc.data();
                let imgDisplay = "";

                if (p.images && p.images[0]) {
                    imgDisplay = p.images[0];
                } else if (p.sku) {
                    const parts = p.sku.split('.');
                    imgDisplay = `giftcard${parts[1]}.${parts[2]}.png`;
                } else {
                    imgDisplay = "spfd.png";
                }

                const card = document.createElement("div");
                card.className = "glass-card";

                card.innerHTML = `
                    <div class="gift-image-wrap">
                        <img 
                            src="${imgDisplay}" 
                            onerror="this.src='spfd.png'"
                        >
                    </div>
                    <div class="gift-content">
                        <div class="gift-top">
                            <span class="card-tag">${p.sku || "STRIX-GC"}</span>
                            <h2>${p.name}</h2>
                            <p>Gift cards will be accepted when payment is collected.</p>
                        </div>
                        <div class="gift-bottom">
                            <div class="gift-price">$${Number(p.price).toFixed(2)}</div>
                            <button 
                                class="gift-btn"
                                onclick="addToCart(
                                    '${doc.id}',
                                    '${p.name}',
                                    ${p.price},
                                    '${imgDisplay}',
                                    '${p.sku || "GC-UPLOAD"}'
                                )"
                            >
                                Add to Cart
                            </button>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        });
    }

    async function addToCart(id, name, price, img, sku) {
        const btn = event.target;

        btn.innerText = "LINKING...";
        btn.disabled = true;

        try {
            const itemCartId = sku || id;
            const itemRef = db.collection("carts")
                .doc(auth.currentUser.uid)
                .collection("items")
                .doc(itemCartId);

            const docSnap = await itemRef.get();

            if (docSnap.exists) {
                await itemRef.update({
                    qty: firebase.firestore.FieldValue.increment(1)
                });
            } else {
                await itemRef.set({
                    productId: id,
                    name: name,
                    price: price,
                    qty: 1,
                    image: img,
                    selections: {
                        "SKU_LOCK": sku
                    },
                    addedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }

            const toast = document.getElementById("toast");
            toast.style.display = "block";

            setTimeout(() => {
                toast.style.display = "none";
            }, 2500);

        } finally {
            btn.innerText = "Add to Cart";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
