<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strix Shop | Report</title>
    <link rel="icon" type="image/png" href="logospfd.png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --surface: rgba(255, 255, 255, 0.18);
            --text-main: #0f172a;
            --text-dim: #475569;
            --border: rgba(255, 255, 255, 0.55);
            --nav-dark: #0a0c12;
            --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.8), inset 0 -1px 2px rgba(0, 0, 0, 0.05);
            --error: #dc2626;
            --success: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(-45deg, #e0e7ff, #f0fdf4, #e0f2fe, #f3e8ff);
            background-size: 400% 400%;
            animation: fluidBackground 20s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.7;
        }

        @keyframes fluidBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Professional Navbar */
        nav {
            background: var(--nav-dark);
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .nav-main {
            display: flex;
            align-items: center;
            padding: 14px 5%;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-box img {
            height: 32px;
            cursor: pointer;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        .nav-right-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: color 0.2s;
        }

        .nav-link-item svg {
            stroke: #cbd5e1;
            transition: stroke 0.2s;
        }

        .nav-link-item:hover {
            color: #ffffff;
        }

        .nav-link-item:hover svg {
            stroke: #ffffff;
        }

        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-badge-text {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        /* Container & Card Layout */
        .container {
            max-width: 650px;
            width: 90%;
            margin: 40px auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .report-card {
            background: var(--surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 28px;
            border: 1.5px solid var(--border);
            padding: 40px;
            box-shadow: var(--glass-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 26px;
            color: #1e1b4b;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header p {
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 14px 18px;
            color: var(--text-main);
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        select option {
            background: #ffffff;
            color: var(--text-main);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status-msg {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            margin-top: 15px;
            display: none;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        @media (max-width: 600px) {
            .report-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-main">
        <div class="logo-box" onclick="window.location.href='home.html'">
            <img src="logoh.png" alt="STRIX">
        </div>
        <div class="nav-right-actions">
            <a href="home.html" class="nav-link-item">
                <svg width="15" height="15" fill="none" stroke-width="2.2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Home
            </a>
            <div class="nav-divider"></div>
            <span class="nav-badge-text">REPORT PORTAL</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="report-card">
        <div class="header">
            <h1>File a Report</h1>
            <p>Internal Submission Portal</p>
        </div>

        <form id="report-form">
            <div class="form-group">
                <label>Report Subject</label>
                <input type="text" id="subject" placeholder="e.g. Bug Report, Team Member Report, ..." required>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="category" required>
                    <option value="" disabled selected>Select Classification</option>
                    <option value="Team Member">Report Team Member</option>
                    <option value="Customer Service">Customer Service</option>
                    <option value="Product Issue">Product Issue</option>
                    <option value="Technical Bug">System Bug</option>
                    <option value="Suspicious Activity">Suspicious Activity</option>
                    <option value="Scam">Scam</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Detailed Description</label>
                <textarea id="details" rows="5" placeholder="Provide as much detail as possible..." required></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">SUBMIT TRANSMISSION</button>
            <div id="status-msg" class="status-msg"></div>
        </form>
    </div>
</div>

<footer>
    &copy; 2026 STRIX SHOP. ALL RIGHTS RESERVED.
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyDKed-yuAcwqKqcL6fn2WnBhRPcq-PbDtU", 
        authDomain: "strix-shop.firebaseapp.com", 
        projectId: "strix-shop" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const reportForm = document.getElementById('report-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-msg');

    let currentUser = null;

    auth.onAuthStateChanged(user => {
        currentUser = user;

        if (!user) {
            statusMsg.style.display = "block";
            statusMsg.style.color = "var(--error)";
            statusMsg.innerText = "You are not logged in.";
        }
    });

    reportForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (!currentUser) {
            alert("You must be logged in to submit a report.");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "TRANSMITTING...";

        const reportData = {
            uid: currentUser.uid,
            email: currentUser.email || "No Email",
            subject: document.getElementById('subject').value.trim(),
            category: document.getElementById('category').value,
            details: document.getElementById('details').value.trim(),
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            status: "pending"
        };

        try {
            await db.collection("reports").add(reportData);

            statusMsg.style.display = "block";
            statusMsg.style.color = "var(--success)";
            statusMsg.innerText = "Transmission successful.";

            reportForm.reset();

            setTimeout(() => {
                window.location.href = "home.html";
            }, 2000);

        } catch (error) {
            console.error("REPORT ERROR:", error);

            submitBtn.disabled = false;
            submitBtn.innerText = "SUBMIT TRANSMISSION";

            statusMsg.style.display = "block";
            statusMsg.style.color = "var(--error)";
            statusMsg.innerText = error.message;
        }
    });
</script>
</body>
</html>
