<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strix Shop | Report Portal</title>
    <link rel="icon" type="image/png" href="logospfd.png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --surface: rgba(255, 255, 255, 0.25);
            --surface-hover: rgba(255, 255, 255, 0.35);
            --text-main: #0f172a;
            --text-dim: #475569;
            --border: rgba(255, 255, 255, 0.6);
            --nav-dark: #0a0c12;
            --glass-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.9), inset 0 -1px 2px rgba(0, 0, 0, 0.05);
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(-45deg, #e0e7ff, #f0fdf4, #e0f2fe, #f3e8ff);
            background-size: 400% 400%;
            animation: fluidBackground 18s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.6;
        }

        @keyframes fluidBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            opacity: 0;
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
        }

        /* Glass Navbar */
        nav {
            background: rgba(10, 12, 18, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0,0,0,0.2);
        }

        .nav-main {
            display: flex;
            align-items: center;
            padding: 16px 5%;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-box img {
            height: 34px;
            cursor: pointer;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-box img:hover {
            transform: scale(1.05);
        }

        .nav-right-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: color 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-link-item svg {
            stroke: #cbd5e1;
            transition: stroke 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-link-item:hover {
            color: #ffffff;
        }

        .nav-link-item:hover svg {
            stroke: #ffffff;
        }

        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-badge-text {
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 1px;
            font-family: 'Quicksand', monospace;
        }

        /* Container & Card Layout */
        .container {
            max-width: 680px;
            width: 90%;
            margin: 50px auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .report-card {
            background: var(--surface);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 32px;
            border: 1.5px solid var(--border);
            padding: 45px;
            box-shadow: var(--glass-shadow);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .report-card:hover {
            background: var(--surface-hover);
            box-shadow: 0 30px 60px -15px rgba(99, 102, 241, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.95);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 30px;
            color: #1e1b4b;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header p {
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 600;
        }

        .header p a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .header p a:hover {
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-family: 'Quicksand', monospace;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 18px;
            padding: 15px 20px;
            color: var(--text-main);
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        select option {
            background: #ffffff;
            color: var(--text-main);
            font-weight: 600;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 14px;
            font-family: 'Quicksand', monospace;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.45);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status-msg {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            margin-top: 18px;
            display: none;
            font-family: 'Quicksand', monospace;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            font-family: 'Quicksand', monospace;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
                margin: 20px auto;
            }
            .report-card {
                padding: 25px;
                border-radius: 24px;
            }
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-main">
        <div class="logo-box" onclick="window.location.href='home.html'">
            <img src="logoh.png" alt="STRIX">
        </div>
        <div class="nav-right-actions">
            <a href="home.html" class="nav-link-item">
                <svg width="15" height="15" fill="none" stroke-width="2.2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Home
            </a>
            <div class="nav-divider"></div>
            <span class="nav-badge-text">REPORT PORTAL</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="report-card">
        <div class="header">
            <h1>File a Report</h1>
            <p>You can also reach us directly at <a href="mailto:hello.strix@outlook.com">hello.strix@outlook.com</a></p>
        </div>

        <form id="report-form">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label>Report Subject</label>
                <input type="text" id="subject" placeholder="e.g. Bug Report, Team Member Report..." required>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="category" required>
                    <option value="" disabled selected>Select Classification</option>
                    <option value="Team Member">Report Team Member</option>
                    <option value="Customer Service">Customer Service</option>
                    <option value="Product Issue">Product Issue</option>
                    <option value="Technical Bug">System Bug</option>
                    <option value="Suspicious Activity">Suspicious Activity</option>
                    <option value="Scam">Scam</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Detailed Description</label>
                <textarea id="details" rows="5" placeholder="Provide as much detail as possible..." required></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">Submit</button>
            <div id="status-msg" class="status-msg"></div>
        </form>
    </div>
</div>

<footer>
    &copy; 2026 STRIX SHOP. ALL RIGHTS RESERVED.
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyDKed-yuAcwqKqcL6fn2WnBhRPcq-PbDtU", 
        authDomain: "strix-shop.firebaseapp.com", 
        projectId: "strix-shop" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const reportForm = document.getElementById('report-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-msg');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');

    // Auto-fill user details and fetch firstName/lastName from Firestore if available
    auth.onAuthStateChanged(async user => {
        if (user) {
            if (user.email) {
                emailInput.value = user.email;
            }

            // Check if user has a standard displayName first
            if (user.displayName) {
                nameInput.value = user.displayName;
            } else {
                // Otherwise fetch from Firestore database document (e.g., users collection)
                try {
                    const userDoc = await db.collection("users").doc(user.uid).get();
                    if (userDoc.exists) {
                        const userData = userDoc.data();
                        const firstName = userData.firstName || "";
                        const lastName = userData.lastName || "";
                        const fullName = `${firstName} ${lastName}`.trim();
                        if (fullName) {
                            nameInput.value = fullName;
                        }
                    }
                } catch (err) {
                    console.error("Error fetching user profile data:", err);
                }
            }
        }
    });

    reportForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        submitBtn.disabled = true;
        submitBtn.innerText = "TRANSMITTING...";

        const reportData = {
            name: nameInput.value.trim(),
            email: emailInput.value.trim(),
            subject: document.getElementById('subject').value.trim(),
            category: document.getElementById('category').value,
            details: document.getElementById('details').value.trim(),
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            status: "pending"
        };

        try {
            await db.collection("reports").add(reportData);

            statusMsg.style.display = "block";
            statusMsg.style.color = "var(--success)";
            statusMsg.innerText = "✓ Transmission successful.";

            reportForm.reset();

            setTimeout(() => {
                window.location.href = "home.html";
            }, 2000);

        } catch (error) {
            console.error("REPORT ERROR:", error);

            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";

            statusMsg.style.display = "block";
            statusMsg.style.color = "var(--error)";
            statusMsg.innerText = error.message;
        }
    });
</script>
</body>
</html>
