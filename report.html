<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="spfd.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strix Shop | Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #484976;
            --primary-hover: #5d6c8d;
            --surface: rgba(255, 255, 255, 0.28);
            --surface-hover: rgba(255, 255, 255, 0.38);
            --text-main: #0f172a;
            --text-dim: #475569;
            --border: rgba(255, 255, 255, 0.6);
            --border-subtle: rgba(226, 232, 240, 0.5);
            --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.8), inset 0 -1px 2px rgba(0, 0, 0, 0.05);
            --radius-main: 32px;
            --error: #ef4444;
            --success: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body { 
            font-family: 'Quicksand', sans-serif; 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.6;
            position: relative;
        }

        /* Background Layer with Random Image Support */
        .bg-layer {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.65;
            z-index: -2;
            transition: all 1s ease-in-out;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(240, 244, 248, 0.75), rgba(224, 231, 255, 0.75));
            z-index: -1;
        }

        /* Entrance Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        /* Navigation Bar */
        nav {
            background: rgba(0, 0, 0, 0.75);
            height: 60px;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
        }

        .nav-main {
            display: flex;
            align-items: center;
            padding: 0 5%;
            justify-content: space-between;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-box img {
            height: 28px;
            cursor: pointer;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-box img:hover {
            transform: scale(1.04);
        }

        .nav-right-actions {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            font-family: 'Quicksand', sans-serif;
            transition: color 0.25s ease;
        }

        .nav-link-item svg {
            stroke: #cbd5e1;
            transition: stroke 0.25s ease;
        }

        .nav-link-item:hover {
            color: #ffffff;
        }

        .nav-link-item:hover svg {
            stroke: #ffffff;
        }

        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-badge-text {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
            font-family: 'Quicksand', sans-serif;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 880px;
            margin: 50px auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .hero {
            text-align: center;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        h1 { 
            font-size: 32px; 
            font-weight: 700; 
            margin: 0 0 10px; 
            color: #1e1b4b; 
            letter-spacing: -0.5px; 
            font-family: 'Quicksand', sans-serif;
        }

        .hero p {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dim);
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
            font-family: 'Quicksand', sans-serif;
        }

        /* Link Styling */
        a {
            color: var(--text-main);
            font-weight: 700;
            text-decoration: none;
            font-family: 'Quicksand', sans-serif;
            transition: color 0.25s ease;
        }

        a:hover {
            color: var(--primary);
            text-decoration: none;
        }

        .glass-card {
            background: var(--surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-main);
            padding: 35px;
            box-shadow: var(--glass-shadow);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.35s cubic-bezier(0.4, 0, 0.2, 1), background 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: var(--surface-hover);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12), inset 0 1px 3px rgba(255, 255, 255, 0.9);
        }

        .card-tag {
            font-family: 'Quicksand', sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--primary);
            margin-bottom: 10px;
            display: block;
            font-weight: 700;
        }

        .glass-card h2 { 
            font-size: 18px; 
            font-weight: 700; 
            margin: 0 0 10px 0; 
            color: #1e1b4b; 
            font-family: 'Quicksand', sans-serif;
        }

        .glass-card p { 
            color: var(--text-dim); 
            line-height: 1.6; 
            font-size: 13px; 
            margin-bottom: 20px; 
            font-weight: 600;
            font-family: 'Quicksand', sans-serif;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 11px;
            margin-bottom: 8px;
            color: var(--text-dim);
            letter-spacing: 0.8px;
            font-family: 'Quicksand', sans-serif;
        }

        .required-star {
            color: var(--error);
            font-family: 'Quicksand', sans-serif;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Quicksand', sans-serif;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.5);
            color: var(--text-main);
            transition: border-color 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(72, 73, 118, 0.1);
        }

        select option {
            background: #ffffff;
            color: var(--text-main);
            font-weight: 600;
        }

        textarea {
            resize: vertical;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 45px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            font-family: 'Quicksand', sans-serif;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(72, 73, 118, 0.3);
            width: 100%;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(72, 73, 118, 0.4);
        }

        .btn-submit:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .status-msg {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            margin-top: 18px;
            display: none;
            font-family: 'Quicksand', sans-serif;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            font-family: 'Quicksand', sans-serif;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .container { width: 95%; margin: 25px auto; }
            .glass-card { padding: 25px; border-radius: 24px; }
            .hero h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

<div class="bg-layer" id="bgLayer"></div>
<div class="bg-overlay"></div>

<nav>
    <div class="nav-main">
        <div class="logo-box" onclick="window.location.href='report.html'">
            <img src="logoh.png" alt="STRIX">
        </div>
        <div class="nav-right-actions">
            <a href="index.html" class="nav-link-item">
                <svg width="15" height="15" fill="none" stroke-width="2.2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Home
            </a>
            <div class="nav-divider"></div>
            <span class="nav-badge-text">Report</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="hero animate-in delay-1">
        <h1>File a Report</h1>
        <p>Need direct help? Reach us at <a href="mailto:hello.strix@outlook.com">hello.strix@outlook.com</a> or contact <a href = "cs.html">Customer Support</a>.</p>
    </div>

    <div class="glass-card animate-in delay-2">
        <span class="card-tag">Report Portal</span>
        <h2>Submit Details</h2>
        <p>Please complete all required fields so our team can address your concern swiftly.</p>

        <form id="report-form">
            <div class="form-group">
                <label>Your Name <span class="required-star">*</span></label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Email Address <span class="required-star">*</span></label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label>Report Subject <span class="required-star">*</span></label>
                <input type="text" id="subject" placeholder="e.g. Bug Report, Team Member Report..." required>
            </div>

            <div class="form-group">
                <label>Category <span class="required-star">*</span></label>
                <select id="category" required>
                    <option value="" disabled selected>Select Classification</option>
                    <option value="Team Member">Report Team Member</option>
                    <option value="Customer Support">Customer Support</option>
                    <option value="Product Issue">Product Issue</option>
                    <option value="Technical Bug">System Bug</option>
                    <option value="Suspicious Activity">Suspicious Activity</option>
                    <option value="Scam">Scam</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Detailed Description <span class="required-star">*</span></label>
                <textarea id="details" rows="5" placeholder="Provide as much detail as possible..." required></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">Submit Report</button>
            <div id="status-msg" class="status-msg"></div>
        </form>
    </div>
</div>

<footer>
    &copy; 2026 STRIX SHOP. ALL RIGHTS RESERVED.
</footer>

<script>
    // Random Background Image Loader
    const n = Math.floor(Math.random() * 12) + 1;
    const bgLayer = document.getElementById("bgLayer");
    const img = new Image();
    img.src = `bg${n}.png`;
    img.onload = () => bgLayer.style.backgroundImage = `url('${img.src}')`;
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyDKed-yuAcwqKqcL6fn2WnBhRPcq-PbDtU", 
        authDomain: "strix-shop.firebaseapp.com", 
        projectId: "strix-shop" 
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();

    const reportForm = document.getElementById('report-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-msg');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');

    // Auto-fill user details from Auth / Firestore
    auth.onAuthStateChanged(async user => {
        if (user) {
            if (user.email) {
                emailInput.value = user.email;
            }

            if (user.displayName) {
                nameInput.value = user.displayName;
            } else {
                try {
                    const userDoc = await db.collection("users").doc(user.uid).get();
                    if (userDoc.exists) {
                        const userData = userDoc.data();
                        const firstName = userData.firstName || userData.fname || "";
                        const lastName = userData.lastName || userData.lname || "";
                        const fullName = `${firstName} ${lastName}`.trim();
                        if (fullName) {
                            nameInput.value = fullName;
                        }
                    }
                } catch (err) {
                    console.error("Error fetching user profile data:", err);
                }
            }
        }
    });

    reportForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        submitBtn.disabled = true;
        submitBtn.innerText = "Transmitting...";

        const reportData = {
            name: nameInput.value.trim(),
            email: emailInput.value.trim(),
            subject: document.getElementById('subject').value.trim(),
            category: document.getElementById('category').value,
            details: document.getElementById('details').value.trim(),
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            status: "pending"
        };

        try {
            await db.collection("reports").add(reportData);

            statusMsg.style.display = "block";
            statusMsg.style.color = "var(--success)";
            statusMsg.innerText = "✓ Transmission successful.";

            reportForm.reset();

            setTimeout(() => {
                window.location.href = "index.html";
            }, 2000);

        } catch (error) {
            console.error("REPORT ERROR:", error);

            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Report";

            statusMsg.style.display = "block";
            statusMsg.style.color = "var(--error)";
            statusMsg.innerText = error.message;
        }
    });
</script>
</body>
</html>
