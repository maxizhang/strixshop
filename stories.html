<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#484976">
    <link rel="icon" type="image/png" href="spfd.png">
    <title>Strix Shop | Customer Stories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #484976;
            --surface: rgba(255, 255, 255, 0.28);
            --surface-hover: rgba(255, 255, 255, 0.38);
            --text-main: #0f172a;
            --text-dim: #475569;
            --border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.08),
                inset 0 1px 2px rgba(255, 255, 255, 0.8),
                inset 0 -1px 2px rgba(0, 0, 0, 0.05);
            --radius-main: 32px;
            --star-active: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.6;
            position: relative;
        }

        .bg-layer {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.65;
            z-index: -2;
            transition: all 1s ease-in-out;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(240, 244, 248, 0.75), rgba(224, 231, 255, 0.75));
            z-index: -1;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        nav {
            background: rgba(0, 0, 0, 0.75);
            height: 60px;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
        }

        .nav-main {
            display: flex;
            align-items: center;
            padding: 0 5%;
            justify-content: space-between;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-box img {
            height: 28px;
            cursor: pointer;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-box img:hover { transform: scale(1.04); }

        .nav-right-actions {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: color 0.25s ease;
        }

        .nav-link-item svg {
            stroke: #cbd5e1;
            transition: stroke 0.25s ease;
        }

        .nav-link-item:hover { color: #ffffff; }
        .nav-link-item:hover svg { stroke: #ffffff; }

        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-badge-text {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 880px;
            margin: 50px auto;
            flex: 1;
        }

        .hero {
            text-align: center;
            margin-bottom: 40px;
            padding: 0 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 10px;
            color: #1e1b4b;
            letter-spacing: -0.5px;
        }

        .hero p {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dim);
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }

        .section {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 24px;
        }

        .glass-card {
            min-width: 0;
            background: var(--surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-main);
            padding: 35px;
            box-shadow: var(--glass-shadow);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                background 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: var(--surface-hover);
            transform: translateY(-4px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12),
                inset 0 1px 3px rgba(255, 255, 255, 0.9);
        }

        .card-tag {
            font-family: 'Quicksand', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--primary);
            margin-bottom: 10px;
            display: block;
            font-weight: 700;
            text-transform: uppercase;
        }

        .glass-card h2 {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 10px;
            color: #1e1b4b;
            overflow-wrap: anywhere;
        }

        .glass-card p {
            color: var(--text-dim);
            line-height: 1.6;
            font-size: 13px;
            margin: 0;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .story-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        .story-date {
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 700;
        }

        .stars-display {
            color: var(--star-active);
            font-size: 16px;
            letter-spacing: 2px;
            font-weight: 700;
            margin: 0 0 12px;
        }

        .rating-number {
            color: var(--text-dim);
            font-size: 12px;
            letter-spacing: 0;
            font-weight: 700;
        }

        .survey-breakdown {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px 14px;
            background: rgba(255, 255, 255, 0.35);
            padding: 14px;
            border-radius: 14px;
            font-size: 12px;
            margin: 16px 0;
            border: 1px solid rgba(255, 255, 255, 0.6);
            font-weight: 600;
        }

        .survey-item {
            color: var(--text-dim);
            overflow-wrap: anywhere;
        }

        .survey-item span {
            font-weight: 700;
            color: #1e1b4b;
        }

        .survey-item.full-width { grid-column: 1 / -1; }

        .details {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-dim);
            font-weight: 600;
            background: rgba(255, 255, 255, 0.5);
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            overflow-wrap: anywhere;
        }

        .customer-meta {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            overflow-wrap: anywhere;
        }

        .wide-panel { margin-bottom: 40px; }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            background: var(--surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-main);
            padding: 40px 25px;
            box-shadow: var(--glass-shadow);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .section { grid-template-columns: 1fr; }
            .container { width: 95%; margin: 25px auto; }
            .glass-card { padding: 25px; border-radius: 24px; }
            .hero h1 { font-size: 26px; }
            .survey-breakdown { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 420px) {
            .nav-right-actions { gap: 12px; }
            .nav-badge-text { font-size: 10px; }
            .survey-breakdown { grid-template-columns: 1fr; }
            .survey-item.full-width { grid-column: auto; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="bg-layer" id="bgLayer"></div>
    <div class="bg-overlay"></div>

    <nav>
        <div class="nav-main">
            <a class="logo-box" href="index.html" aria-label="Strix Shop home">
                <img src="logoh.png" alt="STRIX">
            </a>
            <div class="nav-right-actions">
                <a href="index.html" class="nav-link-item">
                    <svg width="15" height="15" fill="none" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    Home
                </a>
                <div class="nav-divider"></div>
                <span class="nav-badge-text">Customer Stories</span>
            </div>
        </div>
    </nav>

    <main class="container">
        <header class="hero animate-in delay-1">
            <h1>Customer Stories &amp; Feedback</h1>
            <p>Browse ratings and feedback shared by the Strix Shop community.</p>
        </header>

        <section class="section animate-in delay-2" id="reviews-grid" aria-live="polite">
            <div class="empty-state">LOADING CUSTOMER STORIES...</div>
        </section>
    </main>

    <footer>
        &copy; 2026 STRIX SHOP. ALL RIGHTS RESERVED.
    </footer>

    <script>
        // Use the same rotating background image treatment as the About page.
        const backgroundNumber = Math.floor(Math.random() * 12) + 1;
        const backgroundLayer = document.getElementById("bgLayer");
        const backgroundImage = new Image();
        backgroundImage.src = `bg${backgroundNumber}.png`;
        backgroundImage.onload = () => {
            backgroundLayer.style.backgroundImage = `url('${backgroundImage.src}')`;
        };
    </script>

    <!-- Firebase SDKs (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDKed-yuAcwqKqcL6fn2WnBhRPcq-PbDtU",
            authDomain: "strix-shop.firebaseapp.com",
            projectId: "strix-shop",
            storageBucket: "strix-shop.firebasestorage.app"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const reviewsGrid = document.getElementById("reviews-grid");

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            })[character]);
        }

        function getDisplayUser(email) {
            if (!email || typeof email !== "string" || !email.includes("@")) {
                return "Verified Customer";
            }

            const [name, domain] = email.split("@");
            return `${escapeHTML(name.substring(0, 2))}***@${escapeHTML(domain)}`;
        }

        function renderCustomerStories(snapshot) {
            if (snapshot.empty) {
                reviewsGrid.innerHTML = `
                    <div class="empty-state">
                        NO CUSTOMER STORIES RECORDED YET. CHECK BACK SOON!
                    </div>
                `;
                return;
            }

            const cards = [];

            snapshot.forEach(doc => {
                const data = doc.data() || {};
                const survey = data.survey || {};
                const date = data.timestamp && typeof data.timestamp.toDate === "function"
                    ? data.timestamp.toDate().toLocaleDateString()
                    : "Recent";
                const rating = Math.max(0, Math.min(5, Number(data.overallRating) || 5));
                const stars = "★".repeat(rating) + "☆".repeat(5 - rating);
                const productName = escapeHTML(data.productName || "Strix Shop Item");
                const comment = escapeHTML(
                    data.comment || "The customer left a rating without additional written comments."
                );

                const surveyItems = [
                    ["Match Desc:", survey.q1MatchDesc],
                    ["Quality:", survey.q2Quality],
                    ["Packaging:", survey.q3Packaging],
                    ["Delivery:", survey.q4Delivery],
                    ["Value:", survey.q5Value],
                    ["Buy Again:", survey.q6BuyAgain],
                    ["Recommend:", survey.q7Recommend, true]
                ];

                const surveyHTML = surveyItems.map(([label, value, fullWidth]) => `
                    <div class="survey-item${fullWidth ? " full-width" : ""}">
                        <span>${label}</span> ${escapeHTML(value || "N/A")}
                    </div>
                `).join("");

                cards.push(`
                    <article class="glass-card">
                        <div class="story-topline">
                            <span class="card-tag">Community Story</span>
                            <span class="story-date">${escapeHTML(date)}</span>
                        </div>
                        <h2>${productName}</h2>
                        <div class="stars-display" aria-label="${rating} out of 5 stars">
                            ${stars}
                            <span class="rating-number">(${rating}/5)</span>
                        </div>
                        <div class="survey-breakdown">
                            ${surveyHTML}
                        </div>
                        <div class="details">“${comment}”</div>
                        <div class="customer-meta">
                            CUSTOMER: ${getDisplayUser(data.userEmail)}
                        </div>
                    </article>
                `);
            });

            reviewsGrid.innerHTML = cards.join("");
        }

        function loadCustomerStories() {
            db.collection("reviews")
                .orderBy("timestamp", "desc")
                .onSnapshot(renderCustomerStories, error => {
                    console.error("Error loading public stories:", error);
                    reviewsGrid.innerHTML = `
                        <div class="empty-state">
                            UNABLE TO LOAD STORIES AT THE MOMENT.
                        </div>
                    `;
                });
        }

        loadCustomerStories();
    </script>
</body>
</html>
