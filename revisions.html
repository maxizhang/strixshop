<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strix Shop | Document Revisions</title>
    <link rel="icon" type="image/png" href="logospfd.png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --surface: rgba(255, 255, 255, 0.25);
            --surface-hover: rgba(255, 255, 255, 0.35);
            --text-main: #0f172a;
            --text-dim: #475569;
            --border: rgba(255, 255, 255, 0.6);
            --nav-dark: #0a0c12;
            --glass-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.9), inset 0 -1px 2px rgba(0, 0, 0, 0.05);
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(-45deg, #e0e7ff, #f0fdf4, #e0f2fe, #f3e8ff);
            background-size: 400% 400%;
            animation: fluidBackground 18s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.6;
        }

        @keyframes fluidBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            max-width: 900px;
            width: 90%;
            margin: 40px auto;
            flex: 1;
            opacity: 0;
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
        }

        nav {
            background: rgba(10, 12, 18, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0,0,0,0.2);
        }

        .nav-main {
            display: flex;
            align-items: center;
            padding: 16px 5%;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-box img {
            height: 34px;
            cursor: pointer;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-box img:hover {
            transform: scale(1.05);
        }

        .nav-right-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: color 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-link-item:hover {
            color: #ffffff;
        }

        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-badge-text {
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 1px;
            font-family: 'Quicksand', monospace;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 32px;
            color: #1e1b4b;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .header p {
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 600;
            font-family: 'Quicksand', monospace;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .revisions-list {
            display: flex;
            flex-direction: column-reverse;
            gap: 20px;
            margin-bottom: 50px;
        }

        .revision-card {
            background: var(--surface);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 24px;
            border: 1.5px solid var(--border);
            padding: 25px 30px;
            box-shadow: var(--glass-shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .revision-card:hover {
            background: var(--surface-hover);
            transform: translateY(-2px);
        }

        .revision-info h3 {
            font-size: 18px;
            color: #1e1b4b;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .revision-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 12px;
            color: var(--text-dim);
            font-family: 'Quicksand', monospace;
            font-weight: 600;
        }

        .revision-meta span {
            background: rgba(255, 255, 255, 0.5);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .revision-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-download {
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            font-family: 'Quicksand', monospace;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
            white-space: nowrap;
        }

        .btn-download:hover {
            background: var(--primary-hover);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
            border: none;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            display: none;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .fab-add {
            position: fixed;
            bottom: 35px;
            right: 35px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            cursor: pointer;
            border: none;
            z-index: 999;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fab-add:hover {
            transform: scale(1.1) rotate(90deg);
        }

        /* --- REDESIGNED CLEAN POPUP MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 12, 18, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
            animation: fadeIn 0.25s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 28px;
            border: 1.5px solid var(--border);
            padding: 35px;
            width: 100%;
            max-width: 520px;
            box-shadow: var(--glass-shadow);
            max-height: 90vh;
            overflow-y: auto;
            animation: scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes scaleUp {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            padding-bottom: 14px;
        }

        .modal-header h2 {
            font-size: 20px;
            color: #1e1b4b;
            font-weight: 700;
        }

        .modal-close-x {
            background: rgba(0, 0, 0, 0.05);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-dim);
            font-weight: 700;
            transition: all 0.2s;
        }

        .modal-close-x:hover {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            font-family: 'Quicksand', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 11px 14px;
            color: var(--text-main);
            font-family: 'Quicksand', sans-serif;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="file"] {
            padding: 9px;
            background: #f8fafc;
            cursor: pointer;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
        }

        .btn-modal-submit, .btn-modal-cancel {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-modal-submit {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .btn-modal-submit:hover {
            background: var(--primary-hover);
        }

        .btn-modal-cancel {
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-dim);
        }

        .btn-modal-cancel:hover {
            background: rgba(0, 0, 0, 0.1);
            color: var(--text-main);
        }
        /* -------------------------------------- */

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            font-family: 'Quicksand', monospace;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 600px) {
            .revision-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .revision-actions {
                width: 100%;
                justify-content: space-between;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-main">
        <div class="logo-box" onclick="window.location.href='home.html'">
            <img src="logoh.png" alt="STRIX">
        </div>
        <div class="nav-right-actions">
            <a href="home.html" class="nav-link-item">Home</a>
            <div class="nav-divider"></div>
            <span class="nav-badge-text">REVISIONS PORTAL</span>
        </div>
    </div>
</nav>

<div class="container">
    <div class="header">
        <h1>Document Revisions</h1>
        <p>Official Legal & Operational History Log</p>
    </div>

    <div id="revisions-container" class="revisions-list">
        <!-- Revisions rendered dynamically here -->
    </div>
</div>

<button id="fab-add" class="fab-add" title="Upload New Revision">+</button>

<div id="upload-modal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h2>Add Document Revision</h2>
            <button type="button" class="modal-close-x" id="close-modal-x">&times;</button>
        </div>
        <form id="revision-form">
            <div class="form-group full-width">
                <label>Document Type</label>
                <select id="doc-type" required>
                    <option value="" disabled selected>Select Document Type</option>
                    <option value="Terms and Conditions">Terms and Conditions</option>
                    <option value="Privacy Policy">Privacy Policy</option>
                    <option value="Return Policy">Return Policy</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group full-width" id="custom-type-group" style="display:none;">
                <label>Custom Document Type Name</label>
                <input type="text" id="custom-type" placeholder="e.g. Code of Conduct">
            </div>

            <div class="form-group full-width">
                <label>Revision Number (Integer)</label>
                <input type="number" id="rev-number" placeholder="e.g. 1, 2, 5" required min="1">
            </div>

            <div class="form-group">
                <label>Revision Date</label>
                <input type="date" id="rev-date" required>
            </div>

            <div class="form-group">
                <label>Effective Date</label>
                <input type="date" id="eff-date" required>
            </div>

            <div class="form-group full-width">
                <label>Word Document (.docx / .doc)</label>
                <input type="file" id="doc-file" accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required>
            </div>

            <div class="modal-buttons">
                <button type="button" class="btn-modal-cancel" id="cancel-modal">Cancel</button>
                <button type="submit" class="btn-modal-submit" id="submit-rev-btn">Publish</button>
            </div>
        </form>
    </div>
</div>

<footer>
    &copy; 2026 STRIX SHOP. ALL RIGHTS RESERVED.
</footer>

<!-- Firebase SDK Compat -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyDKed-yuAcwqKqcL6fn2WnBhRPcq-PbDtU", 
        authDomain: "strix-shop.firebaseapp.com", 
        projectId: "strix-shop",
        storageBucket: "strix-shop.firebasestorage.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const storage = firebase.storage();

    const MASTER_UID = "PNssYZn1wNUGjmzeAq1eHz2QHKf1";

    const fabAdd = document.getElementById('fab-add');
    const uploadModal = document.getElementById('upload-modal');
    const cancelModal = document.getElementById('cancel-modal');
    const closeModalX = document.getElementById('close-modal-x');
    const docTypeSelect = document.getElementById('doc-type');
    const customTypeGroup = document.getElementById('custom-type-group');
    const revisionForm = document.getElementById('revision-form');
    const revisionsContainer = document.getElementById('revisions-container');

    docTypeSelect.addEventListener('change', (e) => {
        if (e.target.value === 'Other') {
            customTypeGroup.style.display = 'block';
            document.getElementById('custom-type').setAttribute('required', 'true');
        } else {
            customTypeGroup.style.display = 'none';
            document.getElementById('custom-type').removeAttribute('required');
        }
    });

    let currentMasterUser = null;

    auth.onAuthStateChanged((user) => {
        if (user && user.uid === MASTER_UID) {
            currentMasterUser = user;
            fabAdd.style.display = 'flex';
        } else {
            currentMasterUser = null;
            fabAdd.style.display = 'none';
        }
        loadRevisions();
    });

    fabAdd.addEventListener('click', () => { uploadModal.style.display = 'flex'; });
    cancelModal.addEventListener('click', () => { uploadModal.style.display = 'none'; });
    closeModalX.addEventListener('click', () => { uploadModal.style.display = 'none'; });

    function loadRevisions() {
        revisionsContainer.innerHTML = '<p style="text-align:center; color:var(--text-dim);">Loading document revisions...</p>';
        
        db.collection("revisions").orderBy("timestamp", "asc").onSnapshot((snapshot) => {
            revisionsContainer.innerHTML = "";
            if (snapshot.empty) {
                revisionsContainer.innerHTML = '<p style="text-align:center; color:var(--text-dim);">No revision documents posted yet.</p>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;

                const card = document.createElement('div');
                card.className = 'revision-card';
                card.innerHTML = `
                    <div class="revision-info">
                        <h3>${data.name}</h3>
                        <div class="revision-meta">
                            <span>Rev Date: ${data.revisionDate}</span>
                            <span>Effective: ${data.effectiveDate}</span>
                            <span>Posted By: ${data.postedBy}</span>
                        </div>
                    </div>
                    <div class="revision-actions">
                        <a href="${data.fileUrl}" target="_blank" class="btn-download">Open Document (.docx)</a>
                        ${currentMasterUser ? `<button class="btn-delete" style="display:inline-block;" onclick="deleteRevision('${docId}', '${data.filePath}')">🗑️</button>` : ''}
                    </div>
                `;
                revisionsContainer.appendChild(card);
            });
        }, (error) => {
            console.error("Error loading revisions:", error);
            revisionsContainer.innerHTML = '<p style="text-align:center; color:var(--error);">Failed to load revisions. Check console/rules.</p>';
        });
    }

    revisionForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentMasterUser) {
            alert("Unauthorized action. Only the master user can add revisions.");
            return;
        }

        const submitBtn = document.getElementById('submit-rev-btn');
        submitBtn.disabled = true;
        submitBtn.innerText = "UPLOADING...";

        let docType = docTypeSelect.value;
        if (docType === 'Other') {
            docType = document.getElementById('custom-type').value.trim();
        }

        const revisionNumber = parseInt(document.getElementById('rev-number').value, 10);
        
        // Automatically construct name string based on your inputs
        const name = `${docType}, Version ${revisionNumber}`;

        const revisionDate = document.getElementById('rev-date').value;
        const effectiveDate = document.getElementById('eff-date').value;
        const fileInput = document.getElementById('doc-file').files[0];

        if (!fileInput) {
            alert("Please select a document file.");
            submitBtn.disabled = false;
            submitBtn.innerText = "Publish";
            return;
        }

        try {
            const filePath = `revisions/${Date.now()}_${fileInput.name}`;
            const fileRef = storage.ref().child(filePath);
            const snapshot = await fileRef.put(fileInput);
            const fileUrl = await snapshot.ref.getDownloadURL();

            let posterName = currentMasterUser.displayName || currentMasterUser.email || "Master Admin";

            await db.collection("revisions").add({
                documentType: docType,
                name: name,
                revisionNumber: revisionNumber,
                revisionDate: revisionDate,
                effectiveDate: effectiveDate,
                fileUrl: fileUrl,
                filePath: filePath,
                postedBy: posterName,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            uploadModal.style.display = 'none';
            revisionForm.reset();
            customTypeGroup.style.display = 'none';

        } catch (error) {
            console.error("Upload error details:", error);
            alert("Error uploading revision: " + (error.message || error));
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Publish";
        }
    });

    window.deleteRevision = async function(docId, filePath) {
        if (!currentMasterUser) {
            alert("Unauthorized action.");
            return;
        }
        if (confirm("Are you sure you want to delete this document revision?")) {
            try {
                if (filePath) {
                    await storage.ref().child(filePath).delete();
                }
                await db.collection("revisions").doc(docId).delete();
            } catch (error) {
                console.error("Deletion error:", error);
                alert("Failed to delete revision: " + error.message);
            }
        }
    };
</script>
</body>
</html>
