<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>429 | Strix Shop</title>
    <link rel="icon" type="image/png" href="spfd.png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-layer" id="bgLayer"></div>
    <div class="overlay"></div>

    <div class="content-container">
        <div class="top-section">
            <h1 class="error-code">429</h1>
            <p class="error-message">A 429 error means the user has sent too many requests in a given time (rate limiting).</p>
        </div>
        
        <div class="button-group">
            <a href="index.html" class="btn-primary">Home</a>
            <a href="cs.html" class="btn-secondary">Support</a>
        </div>
    </div>

    <script>
        const n = Math.floor(Math.random() * 12) + 1;
        const l = document.getElementById("bgLayer");
        const i = new Image();
        i.src = `bg${n}.png`;
        i.onload = () => l.style.backgroundImage = `url('${i.src}')`;
    </script>
</body>
</html>
