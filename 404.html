<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Strix Shop</title>
    <link rel="icon" type="image/png" href="logospfd.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-text-main: #0f172a;
            --color-text-muted: #648b6e;
            --color-accent-blue: #7881aa;
            --color-accent-cyan: #835797;
            --color-error: #ef4444;
            --color-glass-bg: rgba(255, 255, 255, 0.65);
            --color-glass-border: rgba(255, 255, 255, 0.85);
            --shadow-glass: 0 16px 40px 0 rgba(31, 38, 135, 0.08);
            --shadow-glow: 0 10px 30px rgba(37, 99, 235, 0.2);
            --radius-main: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            background: linear-gradient(-45deg, #eef2ff, #f0f9ff, #e0f2fe, #f8fafc);
            background-size: 400% 400%;
            animation: fluidBackground 18s ease infinite;
            color: var(--color-text-main);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        @keyframes fluidBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #bgstar {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* GLASS CARD CONTAINER */
        .error-container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 800px;
            width: 200%;
            padding: 48px 36px;
            background: var(--color-glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--color-glass-border);
            box-shadow: var(--shadow-glass);
            border-radius: var(--radius-main);
        }

        .glitch-code {
            font-size: 4.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--color-accent-blue), var(--color-accent-cyan));
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            line-height: 1;
            letter-spacing: -1px;
            animation: pulse 2.5s ease-in-out infinite;
        }

        .error-msg {
            font-size: 0.95rem;
            color: #2d2d2d;
            line-height: 1.6;
            margin: 16px 0 28px 0;
            font-weight: 500;
        }

        .error-msg a {
            color: var(--color-accent-blue);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .error-msg a:hover {
            text-decoration: underline;
        }

        .status-line {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.75);
            color: var(--color-text-main);
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-left: 4px solid var(--color-error);
            display: inline-block;
            margin-bottom: 32px;
            word-break: break-all;
        }

        .btn-return {
            display: inline-block;
            background: linear-gradient(135deg, var(--color-accent-blue), var(--color-accent-cyan));
            color: #ffffff;
            padding: 14px 36px;
            text-decoration: none;
            font-weight: 700;
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.82rem;
            box-shadow: var(--shadow-glow);
        }

        .btn-return:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 14px 35px rgba(37, 99, 235, 0.3);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.98); }
        }
    </style>
</head>
<body>

    <canvas id="bgstar"></canvas>

    <div class="error-container">
        <p class="glitch-code">Error: 404</p>
        <div class="error-msg">
            Sorry, the page you are looking for does not exist.
            <br><br>
            Please visit <a href="cs.html">Customer Support</a> for more information or if you believe there is a mistake.
        </div>
        <div class="status-line">ERROR: 518181518111415231254750141520061521144</div>
        <br>
        <a href="home.html" class="btn-return">Return to Home Page</a>
    </div>

    <script>
        const canvas = document.getElementById('bgstar');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resize() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.alpha = Math.random() * 0.35 + 0.1;
                this.blink = (Math.random() * 0.008) + 0.002;
            }
            draw() {
                this.alpha += this.blink;
                if (this.alpha > 0.45 || this.alpha < 0.1) this.blink = -this.blink;
                // Soft blue ambient particles tailored for light glass backdrop
                ctx.fillStyle = `rgba(37, 99, 235, ${this.alpha})`;
                ctx.beginPath(); 
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
                ctx.fill();
            }
        }

        window.addEventListener('resize', () => { 
            resize(); 
            stars = Array.from({length: 120}, () => new Star()); 
        });

        resize(); 
        stars = Array.from({length: 120}, () => new Star());

        (function animate() { 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            stars.forEach(s => s.draw()); 
            requestAnimationFrame(animate); 
        })();
    </script>
</body>
</html>
