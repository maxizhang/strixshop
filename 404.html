<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Strix Shop</title>
    <link rel="icon" type="image/png" href="logospfd.png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-text-main: #0f172a;
            --color-text-dim: #475569;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --color-error: #ef4444;
            --surface: rgba(255, 255, 255, 0.25);
            --surface-hover: rgba(255, 255, 255, 0.35);
            --border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.9), inset 0 -1px 2px rgba(0, 0, 0, 0.05);
            --radius-main: 32px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            background: linear-gradient(-45deg, #e0e7ff, #f0fdf4, #e0f2fe, #f3e8ff);
            background-size: 400% 400%;
            animation: fluidBackground 18s ease infinite;
            color: var(--color-text-main);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        @keyframes fluidBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #bgstar {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* GLASS CARD CONTAINER */
        .error-container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 580px;
            width: 90%;
            padding: 48px 36px;
            background: var(--surface);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1.5px solid var(--border);
            box-shadow: var(--glass-shadow);
            border-radius: var(--radius-main);
            transition: all 0.4s ease;
        }

        .error-container:hover {
            background: var(--surface-hover);
            box-shadow: 0 30px 60px -15px rgba(99, 102, 241, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.95);
        }

        .glitch-code {
            font-size: 4.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            line-height: 1;
            letter-spacing: -1px;
            animation: pulse 2.5s ease-in-out infinite;
        }

        .error-msg {
            font-size: 1rem;
            color: var(--color-text-main);
            line-height: 1.6;
            margin: 16px 0 24px 0;
            font-weight: 600;
        }

        .error-msg a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .error-msg a:hover {
            text-decoration: underline;
        }

        .status-line {
            font-family: 'Quicksand', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.6);
            color: var(--color-text-main);
            padding: 10px 18px;
            border-radius: 14px;
            border: 1.5px solid rgba(239, 68, 68, 0.3);
            border-left: 4px solid var(--color-error);
            display: inline-block;
            margin-bottom: 28px;
            word-break: break-all;
        }

        .btn-return {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #ffffff;
            padding: 15px 36px;
            text-decoration: none;
            font-weight: 700;
            border-radius: 18px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-return:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.45);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.98); }
        }
    </style>
</head>
<body>

    <canvas id="bgstar"></canvas>

    <div class="error-container">
        <p class="glitch-code">404</p>
        <div class="error-msg">
            Sorry, the page you are looking for does not exist.
            <br><br>
            Please visit <a href="cs.html">Customer Support</a> for more information or if you believe there is a mistake.
        </div>
        <div class="status-line">ERROR: 518181518111415231254750141520061521144</div>
        <br>
        <a href="home.html" class="btn-return">Return to Home Page</a>
    </div>

    <script>
        const canvas = document.getElementById('bgstar');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resize() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.alpha = Math.random() * 0.35 + 0.1;
                this.blink = (Math.random() * 0.008) + 0.002;
            }
            draw() {
                this.alpha += this.blink;
                if (this.alpha > 0.45 || this.alpha < 0.1) this.blink = -this.blink;
                ctx.fillStyle = `rgba(99, 102, 241, ${this.alpha})`;
                ctx.beginPath(); 
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
                ctx.fill();
            }
        }

        window.addEventListener('resize', () => { 
            resize(); 
            stars = Array.from({length: 120}, () => new Star()); 
        });

        resize(); 
        stars = Array.from({length: 120}, () => new Star());

        (function animate() { 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            stars.forEach(s => s.draw()); 
            requestAnimationFrame(animate); 
        })();
    </script>
</body>
</html>
