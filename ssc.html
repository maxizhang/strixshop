<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strix Shop | Credits Management</title>
    <link rel="icon" type="image/png" href="spfd.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #484976;
            --primary-hover: #5d6c8d;
            --surface: rgba(255, 255, 255, 0.28);
            --surface-hover: rgba(255, 255, 255, 0.38);
            --text-main: #0f172a;
            --text-dim: #475569;
            --border: rgba(255, 255, 255, 0.6);
            --border-subtle: rgba(226, 232, 240, 0.5);
            --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.8), inset 0 -1px 2px rgba(0, 0, 0, 0.05);
            --radius-main: 28px;
            --green: #16a34a;
            --red: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        body { 
            font-family: 'Quicksand', sans-serif; 
            color: var(--text-main); 
            min-height: 100vh; 
            display: none; /* Hidden until authorized */
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.6;
            position: relative;
        }

        body.authorized {
            display: flex;
        }

        /* Background Layer with Random Image Support */
        .bg-layer {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.65;
            z-index: -2;
            transition: all 1s ease-in-out;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(240, 244, 248, 0.75), rgba(224, 231, 255, 0.75));
            z-index: -1;
        }

        /* Entrance Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.1s; }

        /* Navigation Bar */
        nav {
            background: rgba(0, 0, 0, 0.75);
            height: 60px;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
        }

        .nav-main {
            display: flex;
            align-items: center;
            padding: 0 4%;
            justify-content: space-between;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-box img {
            height: 28px;
            cursor: pointer;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-box img:hover {
            transform: scale(1.04);
        }

        .nav-right-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: color 0.25s ease;
        }

        .nav-link-item svg {
            stroke: #cbd5e1;
            transition: stroke 0.25s ease;
        }

        .nav-link-item:hover {
            color: #ffffff;
        }

        .nav-link-item:hover svg {
            stroke: #ffffff;
        }

        .nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-badge-text {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        /* Main Container Layout matching Admin Reports */
        .container {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 1350px;
            margin: 30px auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .management-app {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
            height: calc(100vh - 160px);
            min-height: 550px;
        }

        .list-panel {
            background: var(--surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-main);
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .list-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .list-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: #1e1b4b;
        }

        .user-search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        .user-search-input:focus {
            background: rgba(255, 255, 255, 0.8);
            border-color: var(--primary);
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .user-item {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: background 0.2s ease, border-left 0.2s ease;
            border-left: 4px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-item:hover {
            background: var(--surface-hover);
        }

        .user-item.active {
            background: rgba(255, 255, 255, 0.55);
            border-left-color: var(--primary);
        }

        .user-pfp {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 1.5px solid var(--border);
            flex-shrink: 0;
        }

        .user-info {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-name-display {
            font-size: 13px;
            font-weight: 700;
            color: #1e1b4b;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-admin {
            font-size: 9px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 999px;
            letter-spacing: 0.5px;
            background: rgba(72, 73, 118, 0.15);
            color: var(--primary);
            border: 1px solid rgba(72, 73, 118, 0.3);
            text-transform: uppercase;
        }

        .user-balance-display {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
        }

        /* Right Panel: Credits Settlement Panel */
        .detail-panel {
            background: var(--surface);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-main);
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 30px 35px;
        }

        .detail-empty {
            margin: auto;
            text-align: center;
            color: var(--text-dim);
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            height: 100%;
            overflow-y: auto;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 20px;
            gap: 15px;
        }

        .header-title-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .editor-subtitle {
            font-size: 10px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .target-name {
            font-size: 24px;
            font-weight: 700;
            color: #1e1b4b;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            background: rgba(255, 255, 255, 0.45);
            padding: 20px 24px;
            border-radius: 18px;
            border: 1px solid var(--border-subtle);
            align-items: center;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .meta-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .ssc-display {
            font-size: 2.8rem;
            font-weight: 700;
            color: #1e1b4b;
            line-height: 1;
        }

        .control-section {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }

        .math-btn {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.7);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .math-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .math-btn.btn-sub { color: var(--red); }
        .math-btn.btn-add { color: var(--green); }
        .math-btn.btn-sub:hover, .math-btn.btn-add:hover { color: white; }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-size: 10px;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        input#manual-ssc {
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            border: 1.5px solid var(--border-subtle);
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 700;
            outline: none;
            transition: all 0.2s ease;
        }

        input#manual-ssc:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(72, 73, 118, 0.15);
        }

        .save-btn {
            padding: 14px 24px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(72, 73, 118, 0.3);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .save-btn:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 10px; }

        footer {
            text-align: center;
            padding: 25px;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 10;
        }

        @media (max-width: 900px) {
            .management-app { grid-template-columns: 1fr; height: auto; }
            .list-panel { height: 350px; }
            .detail-panel { min-height: 450px; }
            .control-group { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

<div class="bg-layer" id="bgLayer"></div>
<div class="bg-overlay"></div>

<nav>
    <div class="nav-main">
        <div class="logo-box" onclick="window.location.href='index.html'">
            <img src="logoh.png" alt="STRIX">
        </div>
        <div class="nav-right-actions">
            <a href="index.html" class="nav-link-item">
                <svg width="15" height="15" fill="none" stroke-width="2.2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Home
            </a>
            <a href="users.html" class="nav-link-item">
                <svg width="15" height="15" fill="none" stroke-width="2.2" viewBox="0 0 24 24"><path d="M4 7v10c0 2.21 3.58 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.58 4 8 4s8-1.79 8-4M4 7c0-2.21 3.58-4 8-4s8 1.79 8 4m0 5c0 2.21-3.58 4-8 4s-8-1.79-8-4"/></svg>
                Personnel Database
            </a>
            <div class="nav-divider"></div>
            <span class="nav-badge-text">Strix Shop Credits</span>
        </div>
    </div>
</nav>

<div class="container animate-in delay-1">
    <div class="management-app">
        <!-- Left Panel: User Selection Roster -->
        <div class="list-panel">
            <div class="list-header">
                <div class="list-header-top">
                    <h2>Credits</h2>
                    <span id="user-count" style="font-size: 11px; font-weight: 700; color: var(--primary);">0 Users</span>
                </div>
                <input type="text" id="search-input" class="user-search-input" placeholder="Search personnel..." oninput="filterUsers()">
            </div>
            <div class="user-list" id="user-list">
                <!-- User entries loaded dynamically -->
            </div>
        </div>

        <!-- Right Panel: Balance Editor -->
        <div class="detail-panel">
            <div id="placeholder" class="detail-empty">
                Select a user from the roster to adjust balance
            </div>

            <div class="editor-container" id="editor-card" style="display: none;">
                <div class="detail-header">
                    <div class="header-title-box">
                        <span class="editor-subtitle">Account Settlement</span>
                        <div id="target-name" class="target-name">User Name</div>
                    </div>
                </div>

                <div class="meta-grid">
                    <div class="meta-item">
                        <span class="meta-label">Current Balance</span>
                        <div class="ssc-display" id="ssc-view">0</div>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Currency Unit</span>
                        <span style="font-weight: 700; font-size: 14px; color: var(--text-main);">Strix Store Credits (SSC)</span>
                    </div>
                </div>

                <div class="control-section">
                    <div class="input-group">
                        <span class="input-label">Quick Adjust Balance</span>
                        <div class="control-group">
                            <button class="math-btn btn-sub" onclick="adjust(-10)">-10</button>
                            <button class="math-btn btn-sub" onclick="adjust(-5)">-5</button>
                            <button class="math-btn btn-sub" onclick="adjust(-1)">-1</button>
                            <button class="math-btn btn-add" onclick="adjust(1)">+1</button>
                            <button class="math-btn btn-add" onclick="adjust(5)">+5</button>
                            <button class="math-btn btn-add" onclick="adjust(10)">+10</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="manual-ssc">Override Credit Value</label>
                        <input type="number" id="manual-ssc" value="0">
                    </div>

                    <button class="save-btn" id="save-btn" onclick="saveSSC()">
                        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
                        Update Database
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<footer>
    &copy; 2026 STRIX SHOP. ALL RIGHTS RESERVED.
</footer>

<script>
    // Dynamic Background Image Loader
    const n = Math.floor(Math.random() * 12) + 1;
    const bgLayer = document.getElementById("bgLayer");
    const img = new Image();
    img.src = `bg${n}.png`;
    img.onload = () => bgLayer.style.backgroundImage = `url('${img.src}')`;
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDKed-yuAcwqKqcL6fn2WnBhRPcq-PbDtU", authDomain: "strix-shop.firebaseapp.com", projectId: "strix-shop" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let activeUserId = null;
    let currentBalance = 0;
    let allUsersCache = [];

    function loadAllUsers() {
        const list = document.getElementById('user-list');
        onSnapshot(collection(db, "users"), (snap) => {
            allUsersCache = [];
            snap.forEach(uDoc => {
                allUsersCache.push({ id: uDoc.id, ...uDoc.data() });
            });
            renderUserList(allUsersCache);
        });
    }

    function renderUserList(users) {
        const list = document.getElementById('user-list');
        document.getElementById('user-count').innerText = `${users.length} Users`;
        list.innerHTML = '';
        
        users.forEach(u => {
            const isAdmin = u.acc === "admin";
            const userBalance = u.ssc !== undefined ? u.ssc : 100;
            const fullName = `${u.firstName || ""} ${u.lastName || ""}`.trim() || "Unnamed User";

            const div = document.createElement('div');
            div.className = `user-item ${activeUserId === u.id ? 'active' : ''}`;
            div.innerHTML = `
                <div class="user-pfp" style="background-image:url('${u.pfp || 'https://via.placeholder.com/150'}')"></div>
                <div class="user-info">
                    <div class="item-top">
                        <div class="user-name-display">
                            ${fullName}
                            ${isAdmin ? '<span class="badge-admin">Admin</span>' : ''}
                        </div>
                    </div>
                    <div class="user-balance-display">Balance: ${userBalance} SSC</div>
                </div>
            `;
            div.onclick = () => selectUser(u.id, fullName, userBalance, div);
            list.appendChild(div);
        });
    }

    window.filterUsers = () => {
        const q = document.getElementById('search-input').value.toLowerCase();
        const filtered = allUsersCache.filter(u => {
            const fullName = `${u.firstName || ""} ${u.lastName || ""}`.toLowerCase();
            return fullName.includes(q);
        });
        renderUserList(filtered);
    };

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = "signin.html";
            return;
        }

        const docSnap = await getDoc(doc(db, "users", user.uid));

        if (!docSnap.exists()) {
            window.location.href = "index.html";
            return;
        }

        const currentUserData = docSnap.data();

        if (currentUserData.acc !== "admin") {
            window.location.href = "index.html";
            return;
        }

        document.body.classList.add("authorized");
        loadAllUsers();
        window.currentUserData = currentUserData;
    });

    function selectUser(id, name, ssc, element) {
        activeUserId = id;
        currentBalance = ssc;
        
        document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
        if (element) element.classList.add('active');

        document.getElementById('placeholder').style.display = 'none';
        document.getElementById('editor-card').style.display = 'flex';
        document.getElementById('target-name').innerText = name;
        updateUI();
    }

    window.adjust = (amt) => {
        currentBalance += amt;
        updateUI();
    };

    document.getElementById('manual-ssc').addEventListener('input', (e) => {
        currentBalance = parseInt(e.target.value) || 0;
        document.getElementById('ssc-view').innerText = currentBalance;
    });

    function updateUI() {
        document.getElementById('ssc-view').innerText = currentBalance;
        document.getElementById('manual-ssc').value = currentBalance;
    }

    window.saveSSC = async () => {
        if (!window.currentUserData || window.currentUserData.acc !== "admin") {
            alert("Access Denied");
            return;
        }
        if(!activeUserId) return;
        
        const newVal = parseInt(document.getElementById('manual-ssc').value) || 0;
        const btn = document.getElementById('save-btn');
        btn.innerText = "Syncing...";
        btn.disabled = true;

        try {
            await updateDoc(doc(db, "users", activeUserId), { ssc: newVal });
            alert("Balance successfully updated!");
        } catch (e) {
            console.error(e);
            alert("Error: Database action failed.");
        } finally {
            btn.innerHTML = `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg> Update Database`;
            btn.disabled = false;
        }
    };
</script>
</body>
</html>
